name: ago-chat-infra

# Infrastructure only - Postgres, RabbitMQ, Redis, MinIO. The apps run from the IDE against this
# (docs/runbooks/local-dev.md); testing anything about scale-out belongs in the Kubernetes loop
# instead (.claude/skills/local-cluster/SKILL.md).

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    ports:
      - "5432:5432"
    # `18`: the mount point moved one level up - the 18+ image's own entrypoint refuses to start
    # against a volume mounted directly at .../postgresql/data (docker-library/postgres#1259), so the
    # named volume now sits at the parent and Postgres places PGDATA in its own subdirectory.
    volumes:
      - postgres-data-pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # management UI - http://localhost:15672
      # `15-03`: the rabbitmq_prometheus plugin's endpoint, already enabled in this image. Published
      # so the compose loop's Prometheus can scrape it through host.docker.internal, the same way it
      # reaches the three Ago.Chat.* hosts running from the IDE. The alert *rules* that read these
      # metrics ship only in k8s/overlays/demo - alerting on a developer's own machine is out of
      # scope for `15-03` - but the queue-depth data is worth having in Grafana on both loops.
      - "15692:15692" # Prometheus metrics
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # rabbitmq-diagnostics ping genuinely takes longer than the other three services' checks,
      # especially under host load - a 3s timeout flagged a fully-started broker as unhealthy
      # (verified: server logs showed a clean startup while the healthcheck kept timing out).
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # console - http://localhost:9001
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # `15-01`/`adr/0036`: creates Keycloak's own logical database and role inside the Postgres container
  # above, before Keycloak is allowed to start. Same script and same reasoning as
  # k8s/base/keycloak.yaml's initContainer (read that file's comment for why an initdb.d script is not
  # an option): the official Postgres image only ever creates POSTGRES_DB, and only on the first
  # initialisation of an empty volume, so an existing postgres-data volume would never grow a second
  # database. A one-shot service rather than an init container because compose has no such concept -
  # service_completed_successfully is the equivalent, and keycloak waits on it below.
  keycloak-db-init:
    image: postgres:18-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
    entrypoint: ["sh", "-c"]
    # A one-item sequence, not a plain string: compose word-splits a string `command:` the way a shell
    # would, so the block below would arrive as `sh -c set -eu export ...` - which runs the builtin
    # `set` with no arguments, prints the environment, and exits 0. That is worse than a failure,
    # because `service_completed_successfully` then reports a step that did nothing as a success and
    # Keycloak fails later with an unexplained "password authentication failed for user keycloak".
    # Found exactly that way while verifying `15-01`. A sequence item is passed through as one argument.
    command:
      - |
        set -eu
        export PGPASSWORD="$$POSTGRES_PASSWORD"
        psql -h postgres -U "$$POSTGRES_USER" -d postgres -v ON_ERROR_STOP=1 \
             -v pw="$$KEYCLOAK_DB_PASSWORD" <<'SQL'
        SELECT 'CREATE ROLE keycloak LOGIN' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'keycloak')\gexec
        ALTER ROLE keycloak WITH LOGIN PASSWORD :'pw';
        SELECT 'CREATE DATABASE keycloak OWNER keycloak' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'keycloak')\gexec
        SQL
        echo "keycloak database ready"

  # `10-05`: the local mail sink. Keycloak's own "Verify Email" required action (`10-01`/`adr/0028`)
  # and its password-reset flow both send through the realm's `smtpServer`, and until this item there
  # was none anywhere in this project - registration ended at `SEND_VERIFY_EMAIL_ERROR ...
  # error="email_send_failed"` in Keycloak's log and the required action never lifted. Mailpit accepts
  # anything on 1025 and never forwards it anywhere, so a local loop can drive the *real* browser flow
  # (register -> open the mail -> click the link -> verified) instead of the admin-API shortcut.
  # Deliberately local-only: the same service exists in k8s/overlays/local/mailpit.yaml and in no other
  # overlay - a mail sink on a public deployment would swallow real mail silently, which is a worse
  # failure than not sending at all.
  mailpit:
    image: axllent/mailpit:v1.31.0
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP - what the realm's smtpServer.host/port points at (KEYCLOAK_SMTP_* below)
      - "8025:8025" # web UI - http://localhost:8025, where the captured mail is read
    healthcheck:
      # Mailpit ships its own probe subcommand for exactly this - the image has no curl or wget.
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # `5-05`/`adr/0022`: the operator IdP. `start-dev` (never `start`, which demands a real TLS/hostname
  # setup this local loop has no use for - `adr/0036` re-examined that choice once a real database was
  # under Keycloak and kept it, deliberately and in writing) plus `--import-realm` to bring in the demo
  # realm/client/operator.
  #
  # `15-01`: KC_DB* is what makes a user created at runtime survive a `docker compose restart`. Before
  # this, Keycloak kept everything in an embedded H2 file inside the container's writable layer, and
  # recreating the container - which `docker compose up` does on any change to this file - destroyed
  # every account that did not come from the realm import. Read `adr/0036` before assuming the import
  # still runs on every boot: it is skip-if-exists, and now that the realm survives, it is skipped.
  # k8s/apply-realm-settings.sh is how a changed realm file reaches a realm that already exists.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: start-dev --import-realm --health-enabled=true
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:?}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      # `10-05`: Keycloak itself never reads these - SMTP is a *realm* setting, not a server setting,
      # and `k8s/apply-smtp-settings.sh` is what turns them into one. They are declared on this
      # container because that script reads them from inside it, which is the only shape that works on
      # both targets: under Kubernetes the identical keys arrive through `envFrom: infra-credentials`
      # (base/keycloak.yaml), so the script's body is the same either way and there is one mechanism
      # rather than two. `:-` defaults, not `:?` - unlike KEYCLOAK_DB_PASSWORD these are not
      # credentials locally (a sink that accepts anything), so an existing .env that predates this item
      # should not stop the stack from coming up; the script says exactly what is missing if it is.
      KEYCLOAK_SMTP_HOST: ${KEYCLOAK_SMTP_HOST:-}
      KEYCLOAK_SMTP_PORT: ${KEYCLOAK_SMTP_PORT:-}
      KEYCLOAK_SMTP_FROM: ${KEYCLOAK_SMTP_FROM:-}
      KEYCLOAK_SMTP_FROM_DISPLAY_NAME: ${KEYCLOAK_SMTP_FROM_DISPLAY_NAME:-}
      KEYCLOAK_SMTP_REPLY_TO: ${KEYCLOAK_SMTP_REPLY_TO:-}
      KEYCLOAK_SMTP_ENVELOPE_FROM: ${KEYCLOAK_SMTP_ENVELOPE_FROM:-}
      KEYCLOAK_SMTP_STARTTLS: ${KEYCLOAK_SMTP_STARTTLS:-}
      KEYCLOAK_SMTP_SSL: ${KEYCLOAK_SMTP_SSL:-}
      KEYCLOAK_SMTP_AUTH: ${KEYCLOAK_SMTP_AUTH:-}
      KEYCLOAK_SMTP_USER: ${KEYCLOAK_SMTP_USER:-}
      KEYCLOAK_SMTP_PASSWORD: ${KEYCLOAK_SMTP_PASSWORD:-}
    ports:
      - "8081:8080" # OIDC - Ago.Chat.Api's Auth:Keycloak:Authority points here
      - "8082:9000" # health/management, separate from the OIDC port as of recent Keycloak versions
    volumes:
      # Lives in k8s/base/, not a sibling keycloak/ folder - kustomize's configMapGenerator needs it
      # inside its own kustomization root (that file's own comment has the detail); this compose file
      # has no such restriction and just reaches up into the same one, so there is still one copy.
      - ../k8s/base/keycloak-realm-import.json:/opt/keycloak/data/import/ago-chat-realm.json:ro
      # `11-07`: the login theme, the same two files kustomize turns into the keycloak-login-theme
      # ConfigMap - laid out here by hand because a bind mount has no configMapGenerator to place
      # `items` for it. Without them this loop is strictly worse than no theme at all: the realm
      # import already carries `loginTheme: ago`, so Keycloak would look for a theme that is not
      # there, log `Failed to find theme ago` and serve the stock one - a local login page that
      # looks nothing like the cluster's, which is exactly the divergence this item exists to end.
      - ../k8s/base/keycloak-theme/theme.properties:/opt/keycloak/themes/ago/login/theme.properties:ro
      - ../k8s/base/keycloak-theme/ago.css:/opt/keycloak/themes/ago/login/resources/css/ago.css:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q 'UP'"]
      interval: 5s
      timeout: 3s
      retries: 20

  # `7-03`: Jaeger receives OTLP traces directly - adr/0025 rejected an OTel Collector in front of it
  # ("no second backend to justify one"), so every host's own Otel:Exporter:Endpoint points straight
  # here. COLLECTOR_OTLP_ENABLED is a no-op on recent Jaeger versions (OTLP is on by default) but kept
  # explicit rather than relying on a default this file does not otherwise document - the same
  # "explicit over implicit" instinct start-dev's own flags follow above. In-memory storage only: a
  # demo cluster restarts often and 7-03's own scope excludes retention/sizing.
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "4317:4317" # OTLP gRPC - Otel:Exporter:Endpoint (adr/0025)
      - "4318:4318" # OTLP HTTP
      - "16686:16686" # Jaeger UI - http://localhost:16686
    healthcheck:
      # 14269 is Jaeger's own admin server, separate from the OTLP/UI ports above - same
      # "health lives on its own port" shape keycloak's own 9000 already follows in this file.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:14269/"]
      interval: 5s
      timeout: 3s
      retries: 10

  # `7-03`: scrapes each Ago.Chat.* host's /metrics endpoint (prometheus-scrape-config.yml, reached
  # from k8s/base/ for the same one-copy reason keycloak's realm import file already documents above).
  #
  # KNOWN GAP, found while wiring this up and not fixable from this repository alone: `7-02` wires
  # metrics through the *same* OTLP push exporter `7-01` already wired for traces
  # (Ago.Platform.Hosting.AddPlatformObservability, both signals sharing one Otel:Exporter:Endpoint) -
  # there is no OpenTelemetry.Exporter.Prometheus.AspNetCore package reference and no
  # MapPrometheusScrapingEndpoint() call anywhere in ago-platform or ago-chat, so no host actually
  # serves a /metrics HTTP endpoint today. This job is wired exactly as `7-03`'s own backlog item
  # describes ("Prometheus scrape config targeting each host's /metrics endpoint"), but every target
  # will show DOWN until that gap is closed on the product side - see this change's own handback notes
  # for the options considered (a Prometheus exporter alongside the existing OTLP one, a config split
  # so metrics push to Prometheus's own OTLP receiver directly, or a collector in front of Jaeger that
  # would reopen adr/0025). Not something this deploy-only item can fix by itself.
  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    ports:
      - "9090:9090" # http://localhost:9090/targets
    volumes:
      - ../k8s/base/prometheus-scrape-config.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  # `7-03`: dashboards and datasources are provisioned from files checked into k8s/base/ (below), never
  # hand-clicked - GF_SECURITY_ADMIN_* mirrors KEYCLOAK_ADMIN_*'s own env-var-driven, no-committed-
  # secret-value shape in this same file.
  grafana:
    image: grafana/grafana-oss:13.0.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
    ports:
      - "3000:3000" # http://localhost:3000
    volumes:
      - ../k8s/base/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ../k8s/base/grafana-dashboard-providers.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ../k8s/base/grafana-dashboard-ingest-delivery.json:/etc/grafana/provisioning/dashboard-files/ingest-delivery.json:ro
      - ../k8s/base/grafana-dashboard-pipeline-internals.json:/etc/grafana/provisioning/dashboard-files/pipeline-internals.json:ro
      - ../k8s/base/grafana-dashboard-resilience.json:/etc/grafana/provisioning/dashboard-files/resilience.json:ro
      - ../k8s/base/grafana-dashboard-connections-assignment.json:/etc/grafana/provisioning/dashboard-files/connections-assignment.json:ro
      - ../k8s/base/grafana-dashboard-cache.json:/etc/grafana/provisioning/dashboard-files/cache.json:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  # `postgres-data-pg18`, not `postgres-data`: an existing `postgres-data` volume holds 17-format
  # PGDATA written directly at its own root, which the 18+ image's mount-point change (see the
  # service definition above) would otherwise present at the wrong relative path. Renaming gives
  # `docker compose up` a genuinely fresh volume automatically; the old `postgres-data` volume is
  # left in place, unreferenced, as a local rollback path (`docker volume ls` finds it).
  postgres-data-pg18:
  rabbitmq-data:
  redis-data:
  minio-data:
  prometheus-data:
  grafana-data:
