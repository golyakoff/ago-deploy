name: ago-chat-infra

# Infrastructure only - Postgres, RabbitMQ, Redis, MinIO. The apps run from the IDE against this
# (docs/runbooks/local-dev.md); testing anything about scale-out belongs in the Kubernetes loop
# instead (.claude/skills/local-cluster/SKILL.md).

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # management UI - http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # rabbitmq-diagnostics ping genuinely takes longer than the other three services' checks,
      # especially under host load - a 3s timeout flagged a fully-started broker as unhealthy
      # (verified: server logs showed a clean startup while the healthcheck kept timing out).
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # console - http://localhost:9001
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # `5-05`/`adr/0022`: the operator IdP. `start-dev` (never `start`, which demands a real TLS/hostname
  # setup this local loop has no use for) plus `--import-realm` to bring in the demo realm/client/
  # operator on every boot - idempotent, matching `create-demo-tenant.sh`'s own fixed-id precedent, so
  # a container recreate never produces a second copy.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: start-dev --import-realm --health-enabled=true
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:?}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
    ports:
      - "8081:8080" # OIDC - Ago.Chat.Api's Auth:Keycloak:Authority points here
      - "8082:9000" # health/management, separate from the OIDC port as of recent Keycloak versions
    volumes:
      # Lives in k8s/base/, not a sibling keycloak/ folder - kustomize's configMapGenerator needs it
      # inside its own kustomization root (that file's own comment has the detail); this compose file
      # has no such restriction and just reaches up into the same one, so there is still one copy.
      - ../k8s/base/keycloak-realm-import.json:/opt/keycloak/data/import/ago-chat-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q 'UP'"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  minio-data:
