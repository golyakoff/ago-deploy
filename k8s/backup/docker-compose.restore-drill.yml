# An isolated scratch target for the restore drill. Nothing here talks to the live deployment, and
# nothing here shares a volume, a network or a port with `docker/docker-compose.yml`'s local dev loop -
# its own project name (`ago-restore-drill`), its own volumes, its own ports.
#
# It is deliberately not the whole product. `Ago.Chat.Api`, the worker, the webhooks host, RabbitMQ and
# Redis are all rebuildable from images and manifests and hold nothing that a restore has to bring
# back; running them would prove that the deployment can start, which is `15-06`'s subject, not this
# one's. What runs here is exactly the three things that carry state: the two databases, the object
# store, and a Keycloak pointed at a restored user store.
#
# The Keycloak service is the load-bearing one. It starts **without `--import-realm`**: if the realm,
# the client, the signing keys and the accounts are not in the restored database, it has nowhere else
# to get them from, and a login simply fails. That is the whole point of running it.
#
#   docker compose -p ago-restore-drill -f docker-compose.restore-drill.yml up -d
#   ... run restore.sh against it ...
#   docker compose -p ago-restore-drill -f docker-compose.restore-drill.yml down -v
#
# `down -v` really does remove the volumes. That is intended: a scratch target that survives the drill
# is a second copy of every visitor's messages sitting on a laptop, outside the retention window that
# `backup-pull.sh` enforces on the artifacts themselves.

services:
  postgres:
    image: postgres:18-alpine
    environment:
      # Scratch credentials, in plain text on purpose - they protect a database that exists for
      # minutes and is deleted afterwards. The restored `keycloak` role's password is reset by
      # restore.sh to KEYCLOAK_DB_SCRATCH_PASSWORD rather than taken from the live deployment.
      POSTGRES_USER: ago
      POSTGRES_PASSWORD: drill-only-not-a-secret
      POSTGRES_DB: postgres
    ports:
      - "15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ago -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: drilluser
      MINIO_ROOT_PASSWORD: drill-only-not-a-secret
    ports:
      - "19000:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    # No --import-realm. See the header.
    command: ["start-dev", "--health-enabled=true"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: drill-only-not-a-secret
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: drill-only-not-a-secret
    ports:
      - "18081:8080"
    depends_on:
      postgres:
        condition: service_healthy
