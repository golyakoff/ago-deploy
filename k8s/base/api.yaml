apiVersion: apps/v1
kind: Deployment
metadata:
  name: ago-chat-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ago-chat-api
  template:
    metadata:
      labels:
        app: ago-chat-api
    spec:
      terminationGracePeriodSeconds: 30 # must exceed the preStop sleep + drain deadline (edge.md)
      containers:
        - name: api
          image: ago-chat-api:local
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: infra-credentials
          env:
            # ChatModule.ConfigureServices requires this (chat/src/Ago.Chat.Module/ChatModule.cs) -
            # in-cluster it points at the postgres Service, not the docker-compose host from
            # local-dev.md. $(VAR) here expands against the envFrom keys above (k8s dependent env
            # vars), not a shell.
            - name: AGO_CHAT_CONNECTION_STRING
              value: "Host=postgres;Port=5432;Database=$(POSTGRES_DB);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD)"
            # RabbitMqOptions (Ago.Platform.Messaging.RabbitMq) marks HostName/UserName/Password
            # [Required] - appsettings.json carries no Messaging:RabbitMq section, so these must
            # come from here or ChatModule's AddRabbitMqMessaging fails validation at startup.
            - name: Messaging__RabbitMq__HostName
              value: "rabbitmq"
            - name: Messaging__RabbitMq__UserName
              value: "$(RABBITMQ_USER)"
            - name: Messaging__RabbitMq__Password
              value: "$(RABBITMQ_PASSWORD)"
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              # nfr.md's Api pod budget at target load - this pod does nothing yet, but the ceiling
              # is the one already committed to, not a Stage-0 guess.
              memory: 512Mi
              cpu: 500m
          startupProbe:
            httpGet:
              path: /healthz/ready
              port: 8080
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 8080
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                # Gives the ingress time to notice readiness went false before the process actually
                # stops (edge.md) - this is placeholder timing until Stage 3 adds real drain
                # behaviour (tell clients to reconnect, then wait for connections to drop).
                command: ["sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: ago-chat-api
spec:
  selector:
    app: ago-chat-api
  ports:
    - port: 80
      targetPort: 8080
