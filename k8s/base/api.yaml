apiVersion: apps/v1
kind: Deployment
metadata:
  name: ago-chat-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ago-chat-api
  template:
    metadata:
      labels:
        app: ago-chat-api
    spec:
      # 3-06: must exceed preStop's sleep (15s, worst-case readiness propagation below) plus
      # ConnectionDrainCoordinator's DrainOptions.DrainTimeout (20s, Ago.Platform.Realtime), with
      # margin left over for the rest of the host to actually stop (edge.md). 15 + 20 = 35; 45 leaves
      # a 10s buffer - not measured, a starting point for Stage 7 to tune (CLAUDE.md: "measure or
      # stay silent" applies to the 45 itself, not to the 35 lower bound, which is arithmetic).
      terminationGracePeriodSeconds: 45
      # `17-05`: stated, not inherited. The chiseled base (`8-00`) already defaults to a non-root user -
      # verified live on the demo node, the container's runtime spec reports uid/gid 1654 - and that is
      # exactly the problem this block fixes: a base-image change would have reversed it silently and
      # nothing here would have objected. Naming 1654 turns a silent reversal into a pod that will not
      # start. `readOnlyRootFilesystem` costs one emptyDir at /tmp and nothing else: this host writes no
      # files of its own (attachment bytes never pass through it - `file-storage.md`).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ago-chat-api:local
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: infra-credentials
          env:
            # ChatModule.ConfigureServices requires this (chat/src/Ago.Chat.Module/ChatModule.cs) -
            # in-cluster it points at the postgres Service, not the docker-compose host from
            # local-dev.md. $(VAR) here expands against the envFrom keys above (k8s dependent env
            # vars), not a shell.
            - name: AGO_CHAT_CONNECTION_STRING
              value: "Host=postgres;Port=5432;Database=$(POSTGRES_DB);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD)"
            # RabbitMqOptions (Ago.Platform.Messaging.RabbitMq) marks HostName/UserName/Password
            # [Required] - appsettings.json carries no Messaging:RabbitMq section, so these must
            # come from here or ChatModule's AddRabbitMqMessaging fails validation at startup.
            - name: Messaging__RabbitMq__HostName
              value: "rabbitmq"
            - name: Messaging__RabbitMq__UserName
              value: "$(RABBITMQ_USER)"
            - name: Messaging__RabbitMq__Password
              value: "$(RABBITMQ_PASSWORD)"
            # 3-04/3-06: ChatModule's AddRedisCaching (site-config cache, cache invalidation) and
            # Ago.Platform.Realtime's connection registry both need this - redis.yaml's Service has
            # no auth, so no credential half like the two blocks above.
            - name: Redis__ConnectionString
              value: "redis:6379"
            # 3-06: Program.cs falls back to a random per-process key when this is unset (fine for
            # the single-instance dotnet-run dev loop) - required here because 3 replicas behind a
            # Gateway with no sticky sessions must all validate the same visitor/operator tokens.
            - name: Auth__SigningKey
              value: "$(AUTH_JWT_SIGNING_KEY)"
            # `5-05`/`adr/0022`: the Operator scheme's issuer/JWKS source - keycloak.yaml's own
            # Service, not the docker-compose loop's localhost:8081 (local-dev.md).
            - name: Auth__Keycloak__Authority
              value: "http://keycloak:8080/realms/ago-chat"
            # `7-03`: found while verifying this item's own Done-when live - S3StorageOptions is
            # validated at startup for every host now (not just Api), and this manifest never carried
            # it, so this pod crash-looped the moment a fresh image reached ValidateOnStart. Pre-existing
            # gap since `5-02`, unrelated to 7-01/7-02/7-03's own scope - fixed here only because a
            # healthy pod is this item's own Done-when bar. Same values appsettings.Development.json's
            # fast-loop config already uses, minio.yaml's own Service instead of localhost.
            - name: Storage__S3__ServiceUrl
              value: "http://minio:9000"
            - name: Storage__S3__AccessKey
              value: "$(MINIO_ROOT_USER)"
            - name: Storage__S3__SecretKey
              value: "$(MINIO_ROOT_PASSWORD)"
            - name: Storage__S3__Bucket
              value: "attachments"
            # `7-03`: same finding as above - WebhookSecretCipherOptions is bound and validated for
            # every host (ChatModule.ConfigureServices), not only Ago.Chat.Webhooks. Same throwaway
            # local dev value appsettings.Development.json already commits in plain text.
            - name: Webhooks__SecretEncryptionKey
              value: "Vg1G2KjonUB1uH8trETJzr30EPoeqt0YRGzYibDKy1o="
            # `7-03`: PlatformObservabilityOptions.Exporter.Endpoint is [Required] - AddPlatformObservability
            # (7-01/7-02) fails ValidateOnStart without it, and appsettings.json carries no default (only
            # appsettings.Development.json does, for the fast loop). jaeger.yaml's own Service, not the
            # compose loop's localhost:4317 (adr/0025: every host exports OTLP directly here, no collector).
            # `8-07`/ago-root `adr/0058`: the demo-tenant minting path. **Off here, on purpose.** An
            # endpoint that creates tenants from the public internet is not something a host should
            # acquire by upgrading, and only the demo deployment wants it - overlays/demo patches this
            # to "true" and supplies the origin. While it is false the Keycloak credential below is not
            # required either (see AddKeycloakDemoIdentities), which is what lets the local loop and any
            # real customer's installation run with none of it configured.
            - name: DemoTenant__Enabled
              value: "false"
            - name: DemoTenant__VisitorOrigin
              value: "http://localhost:3000"
            - name: Keycloak__Admin__BaseUrl
              value: "http://keycloak:8080"
            - name: Keycloak__Admin__Realm
              value: "ago-chat"
            - name: Keycloak__Admin__ClientId
              value: "ago-demo-provisioner"
            # The one credential in this system that lets a web-facing process write to the identity
            # provider (`17-03`'s inventory). Applied to the realm by k8s/apply-demo-provisioner.sh,
            # which also grants the service account its single role.
            - name: Keycloak__Admin__ClientSecret
              value: "$(KEYCLOAK_DEMO_PROVISIONER_SECRET)"
            - name: Otel__Exporter__Endpoint
              value: "http://jaeger:4317"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              # nfr.md's Api pod budget at target load - this pod does nothing yet, but the ceiling
              # is the one already committed to, not a Stage-0 guess.
              memory: 512Mi
              cpu: 500m
          startupProbe:
            httpGet:
              path: /healthz/ready
              port: 8080
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8080
            periodSeconds: 5
            # Explicit, not just relying on the default: preStop's sleep below is sized directly off
            # this number (worst case periodSeconds * failureThreshold before kubelet marks the pod
            # NotReady and the Gateway stops routing to it).
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 8080
            periodSeconds: 10
          lifecycle:
            preStop:
              # `17-05`: this was `exec: ["sh", "-c", "sleep 15"]` and **it had never once run.** The
              # chiseled base image (`8-00`) contains no shell and no coreutils - `kubectl exec ... --
              # true` in a running pod answers `executable file not found in $PATH` - so every
              # termination since this hook was written logged a `FailedPreStopHook` event and went
              # straight to SIGTERM. A failing preStop hook does not fail a rollout, which is why it
              # stayed invisible: `3-06`'s rolling-deploy verification watched for lost messages and
              # readiness flapping, and saw neither, because a single replica draining slightly early
              # loses nothing a client will notice.
              #
              # `sleep` is Kubernetes' own preStop action (GA since 1.30), executed by the kubelet
              # rather than inside the container, so it needs nothing from the image at all. Same
              # duration, same reasoning as before - see the comment below and `edge.md` - now
              # actually applied. Verified live: a rollout of a pod carrying this form produces no
              # `FailedPreStopHook` event, where the previous form produced one every time.
              sleep:
                seconds: 15
              # 3-06: readinessProbe above can take up to periodSeconds * failureThreshold = 15s
              # worst-case to mark this pod NotReady once /healthz/ready starts failing (edge.md
              # step 2) - sleeping that long before SIGTERM is what actually happens next
              # (ConnectionDrainCoordinator.StopAsync, Ago.Platform.Realtime) guarantees the
              # Gateway has genuinely stopped routing new connections here first. The drain itself
              # is not in this hook - it runs automatically in-process on SIGTERM, during the
              # generic host's own shutdown sequence.
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ago-chat-api
spec:
  selector:
    app: ago-chat-api
  ports:
    - port: 80
      targetPort: 8080
