# `20-20`: `Ago.Calendar.Worker`, this item's own answer to "is the Worker needed on day one" - yes:
# it runs `AvailabilityMaterializationJob` (without it a schedule template never becomes bookable
# slots - `MaterializeAvailabilityHandler`'s own daily horizon push) and `PendingBookingSweepJob`
# (without it a pending booking never resolves - the sweep that turns `20-04`'s confirmation-window
# deadline into an actual `BookingConfirmed`), both load-bearing for the very first tenant.
#
# `replicas: 1`, and unlike `worker.yaml`'s own comment (which now argues raising `ago-chat-worker`'s
# replica count is *safe*, `14-16`/`adr/0089`, because poll ownership is claimed per-credential by a
# Postgres advisory lock), that reasoning does NOT transfer here and this is not that comment copied.
# Both of this host's jobs are timer-driven `IHostedService` loops with no ownership mechanism of
# their own at all - no advisory lock, no leader election, nothing that would stop two replicas from
# each ticking on the same interval and each claiming the same rows. Two replicas here would not share
# the work, it would double-run `AvailabilityMaterializationJob`'s tenant walk and race
# `PendingBookingSweepJob`'s confirmation sweep against itself. One replica is not a placeholder
# pending a load number the way `ago-chat-worker`'s used to be; it is what correctness requires until
# this product grows the equivalent claiming mechanism.
#
# **No `containerPort`, no `readinessProbe`/`livenessProbe`, and no Service - all deliberate, and all
# for the same reason.** `Ago.Calendar.Worker/Program.cs` uses `Host.CreateApplicationBuilder`, the
# bare generic host - not `WebApplication.CreateBuilder`, which is what gives `ago-chat-worker` a
# Kestrel listener to map a health-only `/healthz/*` onto (`worker.yaml`'s own comment: "health
# endpoint only - this host has no business HTTP surface"). This host has no HTTP surface at all,
# business or otherwise: nothing binds any port, so `EXPOSE 8080` in `ago-calendar`'s shared
# Dockerfile is inert for this image the same way its own header already says it is for the migrator.
# A `containerPort` naming a port nothing opens, or a probe against it, would not be a weaker check -
# it would be a check that always fails, or one that only ever proves the TCP stack itself is up. And
# the chiselled base has no shell, so there is no `exec` fallback either. Kubernetes' only health
# signal for this container is therefore the process's own exit code - which is real (a panic or an
# unhandled exception in either job's loop still crashes the container and restarts it), just not
# probed. This is a genuine gap relative to what `ago-chat-worker` gets, confirmed against the source
# rather than assumed, and named in this item's own report rather than papered over with a probe that
# would look like it means something.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ago-calendar-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ago-calendar-worker
  template:
    metadata:
      labels:
        app: ago-calendar-worker
    spec:
      # No preStop needed: with no readiness probe and no Service routing traffic here, there is
      # nothing for a preStop sleep to protect against a Gateway still sending requests to. 30s gives
      # an in-flight `PendingBookingSweepJob` batch (bounded to `BatchSize`, default 100 rows - see
      # that options class) room to finish its current transaction before SIGTERM.
      terminationGracePeriodSeconds: 30
      # `17-05`/`adr/0054`: same reasoning as calendar-api.yaml and calendar-migrator.yaml - stated,
      # not inherited, because the shared Dockerfile's chiselled base only defaults to this uid, and a
      # base-image change should fail loudly rather than silently reintroduce root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ago-calendar-worker:local
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: infra-credentials
          env:
            # Same requirement as calendar-api.yaml - see that manifest's own comment.
            - name: AGO_CALENDAR_CONNECTION_STRING
              value: "Host=postgres;Port=5432;Database=ago_calendar;Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD)"
            # `CalendarModule.ConfigureServices` registers `AddCalendarRateLimiting` unconditionally for
            # every host that loads the module, this one included - but nothing in either
            # `AvailabilityMaterializationJob` or `PendingBookingSweepJob` resolves `IRateLimiter`, so
            # the lazy connection factory never actually opens one here today. Set anyway, for the same
            # reason `api.yaml`/`worker.yaml` keep matching env blocks in `ago-chat` even where one host
            # uses a setting more than the other: a manifest that only works for the code path currently
            # exercised is a manifest one refactor away from a startup crash nobody connected to this
            # file.
            - name: Redis__ConnectionString
              value: "redis:6379"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            # Starting point, not measured (CLAUDE.md) - two lightweight timer loops, no request
            # traffic, no long-lived connections.
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 500m
      volumes:
        - name: tmp
          emptyDir: {}
