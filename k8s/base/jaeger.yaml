apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
spec:
  replicas: 1 # a demo cluster's trace backend, never scaled out here - same reasoning as postgres.yaml
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.65.0
          # docker-compose.yml's own jaeger service comment has the detail: adr/0025 rejected an OTel
          # Collector in front of Jaeger ("no second backend to justify one"), so every
          # Ago.Chat.* host's Otel:Exporter:Endpoint points straight at this Deployment's Service.
          # In-memory storage only - 7-03's own scope excludes retention/sizing, and a demo cluster
          # restarts often enough that trace history surviving a pod restart is not worth a PVC here.
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - containerPort: 4317 # OTLP gRPC
            - containerPort: 4318 # OTLP HTTP
            - containerPort: 16686 # UI + query API (also the datasource Grafana provisions)
            - containerPort: 14269 # admin/health - separate from the three ports above
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          readinessProbe:
            httpGet:
              path: /
              port: 14269
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 14269
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
spec:
  selector:
    app: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: ui
      port: 16686
      targetPort: 16686
    - name: admin
      port: 14269
      targetPort: 14269
