apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
spec:
  replicas: 1 # a demo cluster's trace backend, never scaled out here - same reasoning as postgres.yaml
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      # `17-05`: the image already runs as uid 10001 with gid 0; stated so it cannot drift. Storage is
      # in-memory (the comment below), so nothing here writes to disk at all and the root filesystem
      # can be read-only outright.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.65.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # docker-compose.yml's own jaeger service comment has the detail: adr/0025 rejected an OTel
          # Collector in front of Jaeger ("no second backend to justify one"), so every
          # Ago.Chat.* host's Otel:Exporter:Endpoint points straight at this Deployment's Service.
          # In-memory storage only - 7-03's own scope excludes retention/sizing, and a demo cluster
          # restarts often enough that trace history surviving a pod restart is not worth a PVC here.
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            # `16-05`: a bound on how many traces the in-memory store keeps, because it had none and
            # the consequence was not theoretical. Read off this cluster on 2026-08-26: this pod had
            # been **OOMKilled 7 times**, most recently minutes before the reading, because
            # `jaegertracing/all-in-one`'s memory store defaults to unlimited and simply grows until
            # the container hits the 512Mi limit above. So "how long is a trace kept" had the answer
            # "until the process is killed for holding too many of them" - retention by crash, which
            # loses every trace at once and takes the trace backend down with it. ago-root's
            # `architecture/personal-data.md` said "until the pod restarts", which was true by
            # accident and for the wrong reason.
            #
            # 10000 is derived from a measurement on this cluster, not picked: 3000 requests driven
            # through the API moved this pod's `process_resident_memory_bytes` from 54.7 MB to
            # 70.8 MB, i.e. ~5.4 KB of resident memory per trace at the shape of trace this
            # deployment actually produces. A real conversation trace carries several more spans, so
            # the number is sized against a pessimistic ~20 KB/trace: 10000 x 20 KB = ~200 MB of
            # trace data inside a 512Mi limit, which leaves the Go runtime the headroom it needs to
            # collect rather than to be killed.
            #
            # Worth knowing before raising it: at the rate this cluster currently produces traces,
            # 10000 is on the order of an hour, because the overwhelming majority of spans are
            # liveness/readiness probes and Prometheus scrapes rather than anything anybody would
            # ever look at. The fix for *that* is to filter health-probe routes out of the ASP.NET
            # Core instrumentation in the hosts, which is a change in `ago-chat` and is named as a
            # follow-up in ago-root's `backlog/16-05`, not a bigger number here.
            - name: MEMORY_MAX_TRACES
              value: "10000"
          ports:
            - containerPort: 4317 # OTLP gRPC
            - containerPort: 4318 # OTLP HTTP
            - containerPort: 16686 # UI + query API (also the datasource Grafana provisions)
            - containerPort: 14269 # admin/health - separate from the three ports above
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          readinessProbe:
            httpGet:
              path: /
              port: 14269
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 14269
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
spec:
  selector:
    app: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: ui
      port: 16686
      targetPort: 16686
    - name: admin
      port: 14269
      targetPort: 14269
