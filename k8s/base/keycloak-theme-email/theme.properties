# 25-155 Lane B: the email theme, mounted at /opt/keycloak/themes/ago/email the same way `11-07`'s
# own keycloak-theme/theme.properties already mounts the *login* theme at .../ago/login - see this
# repository's k8s/base/keycloak.yaml for both volume mounts.
#
# `parent=keycloak`, not `parent=base` directly, for the same reason `keycloak-theme/theme.properties`
# picks `keycloak` for the login theme: it is the concrete, non-abstract theme actually shipped by this
# Keycloak version (26.7.3) - `base` itself declares `abstract=true` and is never selected on its own
# (confirmed by reading `org.keycloak.keycloak-themes-26.7.3.jar`'s own theme/base/email/theme.properties
# and theme/keycloak/email/theme.properties, extracted from the running local pod, 2026-09-18). The
# `keycloak` email theme overrides nothing of its own beyond this one line, so functionally this is
# identical to `parent=base` today - but it is the same chain `loginTheme: "ago"` already resolves
# through, and staying on the same rung means one fewer thing to keep in sync if a future Keycloak
# upgrade ever gives the `keycloak` theme its own real email overrides.
#
# Only two FreeMarker templates are overridden here, deliberately: `html/template.ftl` (the shared
# page shell - logo row, card, footer) and the three per-flow `html/*.ftl` files that pass this shell
# a hero icon, a heading and a CTA button. Every other file - the `text/*.ftl` plain-text parts, and
# every *Body/*BodyHtml message value carrying the actual link/expiry copy - is left to fall through
# to `keycloak`/`base` untouched, for the same reason `11-07`'s own login theme comment gives: one
# overridden template is one more thing a Keycloak upgrade can break.
parent=keycloak
