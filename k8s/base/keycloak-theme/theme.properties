# `11-07`: the login theme. Extends Keycloak's own rather than replacing it - a stylesheet appended
# after the parent's, and not one FreeMarker template overridden, because every overridden template
# is one more thing that breaks on a Keycloak upgrade.
parent=keycloak
import=common/keycloak

# The parent's own stylesheets stay and ago.css is appended last, so it overrides by cascade order
# rather than by !important.
styles=css/login.css css/ago.css

# No webfont is loaded here, deliberately (`11-07`'s one real decision). The console fetches Manrope
# and Unbounded from Google Fonts - a trade-off `adr/0030` weighed for a dashboard. This is the one
# page in the product where a third-party request would sit beside a password field, and the identity
# survives on colour, spacing and radii, which is most of what the tokens are. Self-hosting the two
# faces inside this theme is the upgrade path if the type turns out to matter.
