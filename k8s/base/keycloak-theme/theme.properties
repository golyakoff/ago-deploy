# `11-07`: the login theme. Extends Keycloak's own rather than replacing it - a stylesheet appended
# after the parent's, and not one FreeMarker template overridden, because every overridden template
# is one more thing that breaks on a Keycloak upgrade.
#
# `keycloak`, not `keycloak.v2`, and that is worth knowing rather than assuming. Keycloak 26.0's own
# default login theme is `keycloak.v2` (PatternFly v5 markup) - measured, not read: with this theme
# removed, the fallback page links `login/keycloak.v2/css/styles.css`. So this file pins the login
# pages to the *older* markup family, which is a real upgrade exposure the day that theme goes away:
# a parent that cannot be resolved does not fall back to something similar, it falls back to
# Keycloak's built-in default, and every value below stops applying at once.
#
# The exposure is measured too, and it is smaller than it looks. The same ago.css was mounted onto a
# second Keycloak with `parent=keycloak.v2` and `styles=css/styles.css css/ago.css`, and the sign-in
# page computed *identical* values on both - background, card fill and radius, submit fill and
# radius, input radius, link colour, title size. That is what the doubled `pf-c-*`/`pf-v5-c-*`
# selectors in ago.css buy: they are not dead weight against a hypothetical upgrade, they are what
# makes switching this line a one-line change. It is left on the verified parent here because the
# other seven pages of the flow were verified on this one.
parent=keycloak
import=common/keycloak

# The parent's own stylesheets stay and ago.css is appended last, so it overrides by cascade order
# rather than by !important. (Under `keycloak.v2` the parent's sheet is `css/styles.css`, not
# `css/login.css` - the two lines change together or the parent's own styling is dropped.)
styles=css/login.css css/ago.css

# No webfont is loaded here, deliberately (`11-07`'s one real decision). The console fetches Manrope
# and Unbounded from Google Fonts - a trade-off `adr/0030` weighed for a dashboard. This is the one
# page in the product where a third-party request would sit beside a password field, and the identity
# survives on colour, spacing and radii, which is most of what the tokens are. Self-hosting the two
# faces inside this theme is the upgrade path if the type turns out to matter.
