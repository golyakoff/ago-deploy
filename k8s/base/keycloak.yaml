apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1 # local dev IdP only - never scaled out here, same reasoning as postgres.yaml
  # Keycloak's start-dev mode defaults to its embedded H2 database, which only ever allows one
  # process to hold the file open (exclusive-mode lock) - a real deadlock found live (2026-08-24):
  # the default RollingUpdate strategy briefly runs the old and new pod together during any rollout,
  # and with a single-writer embedded DB backing a PVC, both pods then fight over the same exclusive
  # lock and neither ever becomes Ready. Recreate (old pod terminated before the new one starts) is
  # the correct strategy for any single-replica Deployment backed by an exclusive-lock store - the
  # same reasoning postgres.yaml/redis.yaml/rabbitmq.yaml/minio.yaml already apply implicitly by
  # virtue of Postgres/Redis/RabbitMQ/MinIO each managing their own multi-writer safety internally,
  # which Keycloak's embedded H2 specifically does not.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          # `5-05`/`adr/0022`: start-dev, never start (which demands real TLS/hostname config this
          # local overlay has no use for) - --import-realm brings in the demo realm/client/operator
          # on every boot, idempotently (docker-compose's own comment has the detail).
          args: ["start-dev", "--import-realm", "--health-enabled=true"]
          ports:
            - containerPort: 8080 # OIDC - Ago.Chat.Api's Auth:Keycloak:Authority points here
            - containerPort: 9000 # health/management
          envFrom:
            - secretRef:
                name: infra-credentials
          env:
            - name: KEYCLOAK_ADMIN
              value: "$(KEYCLOAK_ADMIN_USER)"
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: 1000m
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm-import
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector:
    app: keycloak
  ports:
    - name: oidc
      port: 8080
      targetPort: 8080
    - name: health
      port: 9000
      targetPort: 9000
