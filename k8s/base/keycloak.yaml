apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1 # local dev IdP only - never scaled out here, same reasoning as postgres.yaml
  # `15-01`: Recreate is kept, but the reason changed with this item. It was originally chosen because
  # `start-dev` defaults to an embedded H2 file that only one process may hold open - a real deadlock
  # found live (2026-08-24) where RollingUpdate briefly ran two pods against one exclusive lock and
  # neither ever became Ready. Keycloak no longer runs on H2 (KC_DB below), and Postgres is perfectly
  # happy with two writers, so that specific deadlock is gone. Recreate stays anyway for the *next*
  # single-writer moment in this deployment's life: a Keycloak image version bump runs a Liquibase
  # schema migration on boot, and two pods migrating the same schema concurrently is a race worth not
  # having on a single-replica Deployment that gains nothing from a rolling update in the first place.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      # `15-01`/`adr/0036`: Keycloak's own rows live in a separate logical database (`keycloak`) inside
      # the *same* Postgres Deployment the application uses - one database server on a one-node cluster
      # (`adr/0026`), two databases that never see each other's schema. Postgres's official image only
      # creates POSTGRES_DB, and only on the very first initialisation of an empty data directory, so a
      # cluster whose PVC already holds data (which is every cluster this change will ever be applied
      # to) would never get a second database from an initdb script. This initContainer creates the role
      # and the database instead: idempotent, runs on every boot, works identically on a fresh cluster
      # and on one that has been up for weeks. It doubles as the startup-ordering dependency - Keycloak
      # cannot boot before Postgres accepts connections, and the pod simply stays in Init until it does,
      # which also means the readiness clock below does not start ticking against a Postgres that is
      # still coming up.
      # `17-05`: uid 1000 with **gid 0**, which is what this image expects - Keycloak's own files are
      # group-root and group-readable so the image can run under an arbitrary uid. Forcing gid 1000
      # here would make its own installation unreadable to it.
      #
      # **No `readOnlyRootFilesystem` on the Keycloak container**, and the reason is a decision that
      # lives elsewhere: `start-dev` re-runs Quarkus's build-time augmentation into /opt/keycloak on
      # every boot (~23s of it, measured in `runbooks/public-deploy.md`). Making that filesystem
      # read-only needs `start --optimized`, which needs a derived, pre-built image -
      # `15-01`/`adr/0036`'s deferred work, not this item's. The init container below does get one,
      # because all it runs is psql.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: create-keycloak-database
          image: postgres:18-alpine # already on every node that runs postgres.yaml - no new image
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: infra-credentials
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              : "${KEYCLOAK_DB_PASSWORD:?not set - add it to the overlay .env feeding infra-credentials}"
              until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1; do
                echo "waiting for postgres..."
                sleep 2
              done
              export PGPASSWORD="$POSTGRES_PASSWORD"
              # The password is passed as a psql variable, not interpolated into SQL text, so it never
              # reaches argv. ALTER ROLE runs unconditionally on purpose: rotating KEYCLOAK_DB_PASSWORD
              # in the .env and restarting the pod is then all a rotation takes.
              psql -h postgres -U "$POSTGRES_USER" -d postgres -v ON_ERROR_STOP=1 \
                   -v pw="$KEYCLOAK_DB_PASSWORD" <<'SQL'
              SELECT 'CREATE ROLE keycloak LOGIN' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'keycloak')\gexec
              ALTER ROLE keycloak WITH LOGIN PASSWORD :'pw';
              SELECT 'CREATE DATABASE keycloak OWNER keycloak' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'keycloak')\gexec
              SQL
              echo "keycloak database ready"
          resources:
            requests:
              memory: 32Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # `5-05`/`adr/0022`: start-dev, never start - `adr/0036` re-examined that choice once a real
          # database was under Keycloak and kept it deliberately, with the reasoning written down there
          # rather than assumed. --import-realm brings in the demo realm/client/operator on first boot.
          # Read `adr/0036` before reading that as "on every boot": with a persistent database the realm
          # survives, and --import-realm is skip-if-exists, so a *changed* realm file does not reach a
          # realm that already exists. k8s/apply-realm-settings.sh is how such a change is applied.
          args: ["start-dev", "--import-realm", "--health-enabled=true"]
          ports:
            - containerPort: 8080 # OIDC - Ago.Chat.Api's Auth:Keycloak:Authority points here
            - containerPort: 9000 # health/management
          envFrom:
            - secretRef:
                name: infra-credentials
          env:
            # $(VAR) here expands against the envFrom Secret above - verified live on this cluster,
            # and the pattern KEYCLOAK_ADMIN has been using since `5-05`.
            - name: KEYCLOAK_ADMIN
              value: "$(KEYCLOAK_ADMIN_USER)"
            # `15-01`/`adr/0036`: the whole point of this item. Without these four, Keycloak keeps its
            # users in an H2 file inside the container's ephemeral writable layer, and every restart,
            # redeploy, eviction and node reboot destroys every account created at runtime - which is
            # every account `10-01`'s self-registration flow exists to create.
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres:5432/keycloak
            - name: KC_DB_USERNAME
              value: keycloak
            - name: KC_DB_PASSWORD
              value: "$(KEYCLOAK_DB_PASSWORD)"
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
            # `11-07`: the theme directory Keycloak looks in. `items` carries the stylesheet to
            # resources/css/ because that is where a theme's static files live and where
            # theme.properties' own `styles=css/ago.css` resolves to.
            - name: login-theme
              mountPath: /opt/keycloak/themes/ago/login
              readOnly: true
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: 1000m
          # Real deadline found live (2026-08-24): Keycloak's first-ever boot on a fresh filesystem
          # does Quarkus's own build-time augmentation (~23s, measured live), then a Liquibase schema
          # migration, then --import-realm - well past this probe's original 20s liveness delay, so
          # Kubernetes killed the pod mid-startup on every attempt (exit 143/SIGTERM, not an internal
          # crash) before it ever finished. A long-running local-dev pod never re-exercised this path
          # (it boots once and stays up for weeks), so the gap was never hit until a real fresh-cluster
          # first boot. Generous initial delays and a wider liveness failureThreshold - a slow first
          # boot is a one-time cost, not a reason to also make every steady-state health check laxer
          # (periodSeconds stays the same once past the initial delay).
          #
          # `15-01` re-measured rather than assuming those numbers carry over, since Liquibase now runs
          # against Postgres over the network instead of a local H2 file (measured on the Docker Desktop
          # cluster, 2026-08-25, from this pod's own logs and its Ready condition):
          #   first boot, empty `keycloak` database: schema creation plus the realm import took ~19s of
          #     the boot; Quarkus logged `started in 29.253s`; HTTP listening ~40s after container start.
          #   restart against the populated database: import skipped in <1s; `started in 10.852s`;
          #     listening 35s after container start; pod Ready 61s after container start.
          # In other words the readiness initialDelaySeconds below is now the binding constraint, not
          # Keycloak - both boots finish inside these delays with room to spare, so they are left
          # unchanged. The init container above absorbs a slow Postgres separately: the pod waits in
          # Init rather than burning readiness attempts against a database that is not up yet.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm-import
        - name: login-theme
          configMap:
            name: keycloak-login-theme
            items:
              - key: theme.properties
                path: theme.properties
              - key: ago.css
                path: resources/css/ago.css
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector:
    app: keycloak
  ports:
    - name: oidc
      port: 8080
      targetPort: 8080
    - name: health
      port: 9000
      targetPort: 9000
