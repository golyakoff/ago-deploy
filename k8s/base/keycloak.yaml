apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1 # local dev IdP only - never scaled out here, same reasoning as postgres.yaml
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          # `5-05`/`adr/0022`: start-dev, never start (which demands real TLS/hostname config this
          # local overlay has no use for) - --import-realm brings in the demo realm/client/operator
          # on every boot, idempotently (docker-compose's own comment has the detail).
          args: ["start-dev", "--import-realm", "--health-enabled=true"]
          ports:
            - containerPort: 8080 # OIDC - Ago.Chat.Api's Auth:Keycloak:Authority points here
            - containerPort: 9000 # health/management
          envFrom:
            - secretRef:
                name: infra-credentials
          env:
            - name: KEYCLOAK_ADMIN
              value: "$(KEYCLOAK_ADMIN_USER)"
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: 1000m
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm-import
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector:
    app: keycloak
  ports:
    - name: oidc
      port: 8080
      targetPort: 8080
    - name: health
      port: 9000
      targetPort: 9000
