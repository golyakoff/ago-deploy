apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ago-chat

resources:
  - namespace.yaml
  - postgres.yaml
  - rabbitmq.yaml
  - redis.yaml
  - minio.yaml
  - keycloak.yaml
  - api.yaml
  - worker.yaml
  - webhooks.yaml
  - jaeger.yaml
  - prometheus.yaml
  - grafana.yaml

# `5-05`/`adr/0022`: the demo realm lives inside this directory (keycloak-realm-import.json), not a
# sibling `keycloak/` folder that would read more naturally - kustomize's configMapGenerator refuses a
# files: source outside its own kustomization root (the same anti-path-traversal restriction the
# local overlay's own secretGenerator comment already documents for .env). docker-compose.yml has no
# such restriction and reaches up into this same file instead, so there is still exactly one copy.
#
# `7-03` follows the same shape for its own config files, checked into this directory rather than a
# sibling `observability/` folder naming-and-structure.md does not name.
#
# `17-06`/ago-root's `adr/0034`: that same file also carries the realm's login-security policy -
# brute-force thresholds, the password policy, the TOTP parameters, and the four token/session
# lifetimes. Until `17-06` every one of them was absent, so Keycloak's upstream defaults applied to a
# realm that has been open to public self-registration since Stage 10 (`adr/0028`). JSON cannot carry
# a comment, so the reasoning for each chosen value lives in `adr/0034` and nowhere else - read it
# before changing a number here. Two Keycloak facts that make this file misleading if taken at face
# value: `--import-realm` is skip-if-exists for a realm that already exists, so editing this file does
# not reconfigure a running Keycloak whose realm survived (this overlay's Keycloak has no persistent
# volume, so its realm does not survive a pod restart and a re-import really does apply); and a
# brand-new top-level entity added here *is* created on the next restart even when the realm itself is
# skipped.
configMapGenerator:
  - name: keycloak-realm-import
    files:
      - ago-chat-realm.json=keycloak-realm-import.json
  - name: prometheus-config
    files:
      - prometheus.yml=prometheus-scrape-config.yml
  - name: grafana-provisioning-datasources
    files:
      - datasources.yml=grafana-datasources.yml
  - name: grafana-provisioning-dashboard-providers
    files:
      - dashboards.yml=grafana-dashboard-providers.yml
  - name: grafana-dashboards
    files:
      - ingest-delivery.json=grafana-dashboard-ingest-delivery.json
      - pipeline-internals.json=grafana-dashboard-pipeline-internals.json
      - resilience.json=grafana-dashboard-resilience.json
      - connections-assignment.json=grafana-dashboard-connections-assignment.json
      - cache.json=grafana-dashboard-cache.json
