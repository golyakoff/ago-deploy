apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ago-chat

resources:
  - namespace.yaml
  - postgres.yaml
  - rabbitmq.yaml
  - redis.yaml
  - minio.yaml
  - keycloak.yaml
  # `8-08`/`adr/0056`: the schema migrator, listed before the hosts it serves - purely for a
  # reader's benefit, since kustomize applies resources by kind and not in list order. What
  # actually orders them is that the hosts refuse to start until the schema is current; see this
  # file's own header.
  - migrator.yaml
  - api.yaml
  - worker.yaml
  - webhooks.yaml
  # `20-20`: AGO Calendar's own three deployables, same ordering convention as the three above -
  # listed migrator-first for a reader, though (unlike `ago-chat`'s hosts) `Ago.Calendar.Api`/
  # `-Worker` have no schema-version guard of their own to enforce it at runtime; see
  # calendar-api.yaml's own header for that gap.
  - calendar-migrator.yaml
  - calendar-api.yaml
  - calendar-worker.yaml
  - jaeger.yaml
  - prometheus.yaml
  - grafana.yaml
  - node-exporter.yaml
  # `16-05`: the only thing in this cluster that deletes anything on a schedule. See the file's own
  # header for what it can and cannot reach, and ago-root's `adr/0057` for the fourteen days.
  - log-retention.yaml

# `5-05`/`adr/0022`: the demo realm lives inside this directory (keycloak-realm-import.json), not a
# sibling `keycloak/` folder that would read more naturally - kustomize's configMapGenerator refuses a
# files: source outside its own kustomization root (the same anti-path-traversal restriction the
# local overlay's own secretGenerator comment already documents for .env). docker-compose.yml has no
# such restriction and reaches up into this same file instead, so there is still exactly one copy.
#
# `7-03` follows the same shape for its own config files, checked into this directory rather than a
# sibling `observability/` folder naming-and-structure.md does not name.
#
# `17-06`/ago-root's `adr/0034`: that same file also carries the realm's login-security policy -
# brute-force thresholds, the password policy, the TOTP parameters, and the four token/session
# lifetimes. Until `17-06` every one of them was absent, so Keycloak's upstream defaults applied to a
# realm that has been open to public self-registration since Stage 10 (`adr/0028`). JSON cannot carry
# a comment, so the reasoning for each chosen value lives in `adr/0034` and nowhere else - read it
# before changing a number here.
#
# `15-01`/`adr/0036` changed what happens to an edit of this file, and corrected a claim this comment
# used to make. Keycloak now keeps its realm in Postgres, so the realm survives a restart, and
# `--import-realm` picks its strategy from what it finds - verified live on 2026-08-25 by reading
# Keycloak's own startup log on both paths:
#   empty database:      Strategy: OVERWRITE_EXISTING   ->  Realm 'ago-chat' imported
#   realm already there: Strategy: IGNORE_EXISTING      ->  Realm 'ago-chat' already exists. Import skipped
# "Import skipped" means the *whole* import is skipped. The previous version of this comment claimed a
# brand-new top-level entity added here would still be created on the next restart; it is not. Tested
# directly: a new realm role and a changed accessTokenLifespan were both added to this file, the pod
# was restarted, and neither reached the realm.
#
# `10-05`: one realm-level setting is deliberately *not* in that file - `smtpServer`. It carries a
# credential (which must never be committed) and its correct value differs between the local mail sink
# and the demo deployment's real sending provider, so it travels the `.env` -> secretGenerator ->
# `infra-credentials` road every other credential here already travels and is applied by
# `k8s/apply-smtp-settings.sh`. Keeping it out of the JSON also means `apply-realm-settings.sh` cannot
# reset the demo's mail configuration to a local sink by accident.
#
# So editing this file alone no longer changes a Keycloak that is already running. Realm-*level*
# settings (everything `adr/0034` chose) are applied with `k8s/apply-realm-settings.sh`, which PUTs
# this same file's realm-level fields onto the live realm and leaves users and clients alone. A new or
# changed client, realm role or group is not covered by that script either - it needs its own
# `kcadm.sh` call, in the same change that edits this file. Do not reach for `kc.sh import
# --override true` instead: it applies everything by replacing the realm, which deletes every
# self-registered user with it.
configMapGenerator:
  - name: keycloak-realm-import
    files:
      - ago-chat-realm.json=keycloak-realm-import.json
  # `11-07`: the login theme. Two files, mounted into the theme directory Keycloak reads - CSS only,
  # extending the stock theme rather than replacing it, so no FreeMarker template is overridden and a
  # Keycloak upgrade has one less thing of ours to break. A ConfigMap rather than a derived image
  # because the whole theme is two text files; that stops being true the moment it carries a font or
  # an image, and the item says so.
  - name: keycloak-login-theme
    files:
      - theme.properties=keycloak-theme/theme.properties
      - ago.css=keycloak-theme/ago.css
  - name: prometheus-config
    files:
      - prometheus.yml=prometheus-scrape-config.yml
  - name: grafana-provisioning-datasources
    files:
      - datasources.yml=grafana-datasources.yml
  - name: grafana-provisioning-dashboard-providers
    files:
      - dashboards.yml=grafana-dashboard-providers.yml
  - name: grafana-dashboards
    files:
      - ingest-delivery.json=grafana-dashboard-ingest-delivery.json
      - pipeline-internals.json=grafana-dashboard-pipeline-internals.json
      - resilience.json=grafana-dashboard-resilience.json
      - connections-assignment.json=grafana-dashboard-connections-assignment.json
      - cache.json=grafana-dashboard-cache.json
