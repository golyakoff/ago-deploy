# `storage: 2Gi` below is a label, not an enforced capacity limit - deliberately, decided in `15-05`
# (2026-08-29). The `local-path` StorageClass backs this PVC with a plain directory on the node's own
# root filesystem and applies no quota: Postgres inside this pod sees the node's real free space, not
# 2Gi (confirmed live - `df` inside the pod reports the node's own ~79G filesystem). `15-05` weighed a
# real quota-enforcing provisioner (LVM- or XFS-quota-backed local-path) against this and chose not to
# build one now: real per-volume usage across all six PVCs here is ~130M combined against tens of
# gigabytes of real free space, so the actual risk is the *node's total* filling, not one component
# outgrowing a declared share a quota would contain - a single node-level alert
# (`15-03`'s `NodeDiskFilling`) covers that more cheaply than six new per-volume quotas would, and a
# real quota provisioner is named as a future item if that stops being true. Resizing this number does
# nothing while the class ignores it; real headroom is managed by that alert and by the reserved-headroom
# budget `15-05` records, never by this field.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  # Recreate, not the default RollingUpdate: this Deployment owns a ReadWriteOnce PVC, and on a
  # single node that claim does not stop two pods mounting the same directory - the *application's*
  # own single-writer lock is what fails instead. Found live 2026-08-25, when a config change to
  # Prometheus produced a new pod crash-looping on "lock DB directory: resource temporarily
  # unavailable" while the old one held it, and the old one was never terminated because the new one
  # never became ready. A rollout that can never complete. Recreate accepts a moment of downtime,
  # which is the honest cost of one node and one copy of the data.
  strategy:
    type: Recreate
  replicas: 1 # the source of truth is never scaled out here - a single local instance is the point
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # `17-05`. The image runs its entrypoint as root and drops to uid 70 itself, so "postgres runs
      # non-root" was true and unstated; this states it, and closes the window in which anything in
      # this pod is root at all.
      #
      # **No `fsGroup`, deliberately, and that is the line that would break it.** `fsGroup` makes
      # Kubernetes chgrp the volume and add group write, which turns PGDATA into 0770 - and Postgres
      # refuses to start on any data directory that is not u=rwx (0700) or u=rwx,g=rx (0750). The
      # local-path directory is already uid 70 mode 0700, so the uid alone is enough and the
      # "obvious" extra line is the harmful one.
      #
      # **No `readOnlyRootFilesystem`, for the same reason.** Postgres needs a writable
      # /var/run/postgresql for its Unix socket; an emptyDir there arrives root-owned 0755 and only
      # `fsGroup` would make it writable by uid 70 - which is the line that cannot be added. Stated
      # rather than quietly skipped.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      # And because `fsGroup` is off the table, this is what makes a **fresh** cluster work.
      # `local-path` creates a PVC directory owned by root; Postgres running as uid 70 would then
      # refuse to initialise into it ("data directory has wrong ownership") - a failure that would
      # never appear on the running deployment, whose directory is already uid 70, and would appear
      # the first time `15-02`'s restore drill rebuilt the cluster from scratch. Same shape as
      # minio.yaml's own init container and for the same underlying reason: a chown no manifest field
      # can express. Idempotent - it re-runs every boot and does nothing on a directory already
      # correct.
      initContainers:
        - name: chown-data
          image: postgres:17-alpine # the same image as the container below - nothing new to pull
          command: ["sh", "-c", "chown 70:70 /var/lib/postgresql/data"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 64Mi
              cpu: 200m
      containers:
        - name: postgres
          image: postgres:17-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: infra-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
              cpu: 500m
          readinessProbe:
            # $(VAR) only expands in a container's own command/args, never in a probe's exec
            # command (kubelet execs it literally, no shell) - verified the hard way: pg_isready
            # ran with the literal argument "$(POSTGRES_USER)" and logged role "$(POSTGRES_USER)"
            # does not exist on every check. A real shell here reads the actual env var.
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
