# `7-03`: one file, both loops - the same "lives in k8s/base/, compose reaches up into it" convention
# keycloak-realm-import.json already established in this directory (docker-compose.yml's own keycloak
# comment has the detail: kustomize's configMapGenerator refuses a files: source outside its own
# kustomization root, docker-compose.yml has no such restriction).
#
# Both the compose-loop target set (host.docker.internal, since the fast loop runs Ago.Chat.* from the
# IDE on the host - docker/docker-compose.yml's own header comment) and the k8s-loop target set (the
# Service DNS names k8s/base/{api,worker,webhooks}.yaml already declare) are listed below, in the same
# job. That is deliberate, not an oversight: whichever loop is actually running has its own targets
# come up UP, and the other loop's targets simply show DOWN (unreachable host/DNS name) without
# breaking the scrape config itself - one file stays the single source of truth instead of two nearly-
# identical ones that would drift.
#
# The KNOWN GAP this header used to describe - "no Ago.Chat.* host currently serves /metrics at all",
# because `7-02` wired an OTLP push exporter and never a scrape endpoint - is CLOSED. The product side
# added AddPrometheusExporter()/MapPrometheusScrapingEndpoint() per host (runbooks/k8s-local.md
# records the fix), and all three k8s-loop targets were verified UP against the live demo on
# 2026-08-25 while wiring `15-03`. The note is corrected rather than deleted: a stale "expect
# everything to be DOWN" is how a real outage gets read as the known gap.
#
# `15-03` added the alerting half. Prometheus now evaluates rules and hands anything firing to an
# Alertmanager. Both of those lines are in this base file while the rules and the Alertmanager itself
# live only in overlays/demo - see the rule_files comment below for why that split is deliberate.
global:
  scrape_interval: 15s

# `15-03`: the glob, not a fixed filename. overlays/demo/kustomization.yaml merges
# `demo.rules.yml` into this same ConfigMap, so the rules land beside prometheus.yml in
# /etc/prometheus and this pattern picks them up; in overlays/local the pattern matches nothing and
# Prometheus starts with zero rules. That is `15-03`'s "alerting on the local development cluster is
# out of scope" enforced by construction rather than by a comment nobody reads - a developer watching
# their own terminal is the notification channel there.
rule_files:
  - /etc/prometheus/*.rules.yml

# `15-03`: Alertmanager is an overlays/demo resource, so this Service name does not resolve in the
# compose loop or in overlays/local. That is harmless rather than merely tolerable: with no rule files
# loaded there is never an alert to send, and a static_configs alertmanager target is not resolved
# until Prometheus actually has something to deliver. Nothing logs an error on a cluster that has no
# alerting.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: ago-chat-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5009"]
        labels:
          loop: compose
      - targets: ["ago-chat-api.ago-chat.svc.cluster.local:80"]
        labels:
          loop: k8s

  # `7-03`: Ago.Chat.Worker has no fixed port in launchSettings.json (no applicationUrl - Kestrel's own
  # default), and running it alongside Ago.Chat.Webhooks (which is in the same position) the way
  # local-dev.md's bring-up sequence does would collide on that shared default. runbooks/local-dev.md's
  # drafted update (this change's handback) fixes both with an explicit ASPNETCORE_URLS - 5010 for
  # Worker, 5011 for Webhooks - and the targets below match those two fixed ports.
  - job_name: ago-chat-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5010"]
        labels:
          loop: compose
      - targets: ["ago-chat-worker.ago-chat.svc.cluster.local:80"]
        labels:
          loop: k8s

  # `15-05`: the machine itself. Unlike the three jobs below this one has no compose-loop twin - the
  # fast loop runs the hosts on the developer's own machine, where a node-exporter reading that
  # machine's disk would be measuring the wrong thing entirely. k8s loop only, deliberately.
  - job_name: node
    metrics_path: /metrics
    static_configs:
      - targets: ["node-exporter.ago-chat.svc.cluster.local:9100"]
        labels:
          loop: k8s

  - job_name: ago-chat-webhooks
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5011"]
        labels:
          loop: compose
      - targets: ["ago-chat-webhooks.ago-chat.svc.cluster.local:80"]
        labels:
          loop: k8s

  # `15-03`: the broker's own metrics, for one question only - is anything sitting in a dead-letter
  # queue. `rabbitmq_prometheus` is already enabled in the `rabbitmq:4-management` image (verified
  # with `rabbitmq-plugins list -e` on the live broker: `[E*] rabbitmq_prometheus 4.3.5`), so this
  # needed no plugin change, only a port on the Service and this job.
  #
  # WHY /metrics/detailed AND NOT /metrics. The default endpoint is aggregated across all queues -
  # it reports 181 messages without saying in which queue, which cannot answer "is a DLQ non-empty".
  # `queue_coarse_metrics` is the one detailed family that carries a per-queue label, and asking for
  # exactly that family keeps the added cardinality to roughly three series per queue instead of
  # everything the detailed endpoint can produce.
  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics]
    static_configs:
      - targets: ["host.docker.internal:15692"]
        labels:
          loop: compose
      - targets: ["rabbitmq.ago-chat.svc.cluster.local:15692"]
        labels:
          loop: k8s

  # `15-03`: cert-manager's own exporter, for the certificate-expiry rule. Cross-namespace on
  # purpose - cert-manager is installed from its own upstream manifests (runbooks/public-deploy.md
  # step 11), not from this repository, so there is nothing here to add a port to; the Service it
  # already publishes on 9402 is scraped where it stands.
  #
  # Like the `node` job above, k8s loop only - a compose loop has no cert-manager and no public TLS
  # to renew. Unlike `node`, this one is also expected DOWN on overlays/local unless the developer
  # has installed cert-manager there, which is the same "the other loop's targets show DOWN" property
  # this file's header already describes, and it alerts on nothing because overlays/local loads no
  # rules.
  - job_name: cert-manager
    metrics_path: /metrics
    static_configs:
      - targets: ["cert-manager.cert-manager.svc.cluster.local:9402"]
        labels:
          loop: k8s
