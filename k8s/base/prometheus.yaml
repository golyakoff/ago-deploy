# `storage: 1Gi` is a label, not an enforced capacity limit - `local-path` applies no quota (`15-05`,
# 2026-08-29). See `postgres.yaml`'s own PVC comment for the full reasoning; it applies identically.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  # Recreate, not the default RollingUpdate: this Deployment owns a ReadWriteOnce PVC, and on a
  # single node that claim does not stop two pods mounting the same directory - the *application's*
  # own single-writer lock is what fails instead. Found live 2026-08-25, when a config change to
  # Prometheus produced a new pod crash-looping on "lock DB directory: resource temporarily
  # unavailable" while the old one held it, and the old one was never terminated because the new one
  # never became ready. A rollout that can never complete. Recreate accepts a moment of downtime,
  # which is the honest cost of one node and one copy of the data.
  strategy:
    type: Recreate
  replicas: 1 # a demo cluster's single metrics store, never scaled out here - same as postgres.yaml
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      # `17-05`: the image already runs as nobody (65534) - stated here so it stays that way. `fsGroup`
      # is safe on this one (unlike postgres.yaml, whose data directory has a mode requirement), and
      # `OnRootMismatch` keeps it from re-walking the whole TSDB on every start.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v3.14.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # prometheus-scrape-config.yml's own header comment has the full detail, including a known
          # gap this item cannot close from ago-deploy alone: no Ago.Chat.* host currently serves
          # /metrics (7-02 wired an OTLP push exporter for metrics, not a Prometheus scrape endpoint).
          #
          # `16-05`: the first two args reproduce the image's own default command exactly
          # (`--config.file`, `--storage.tsdb.path`) - naming any arg replaces the whole default CMD,
          # so leaving one out silently changes where Prometheus reads its config or writes its data.
          # The two retention flags are what this item adds.
          #
          # **Time: 14 days**, aligned with the container-log window in log-retention.yaml and for the
          # same reason (ago-root's `adr/0057`). Prometheus's own default is 15 days, so the change in
          # behaviour is one day; the change that matters is that the number is now *chosen and
          # written down* rather than inherited, which is what a published retention statement needs.
          # `16-05` checked what is actually in here before setting it: 47 label names, none
          # person-shaped - no client address anywhere (`network_peer_address`/`server_address` come
          # from *outbound* HttpClient instrumentation and hold this cluster's own addresses), no
          # email, no id belonging to a person. So this window is about disk and about being able to
          # state a number, not about holding personal data.
          #
          # **Size: 768MB**, against the 1Gi PVC above. Time-based retention alone does not stop a
          # cardinality explosion from filling the volume before the fourteen days are up, and the
          # audit found one label that grows without bound - `node`, whose value is the API pod's
          # HOSTNAME, so every pod replacement adds a new series (8 distinct values already on a
          # single-node local cluster, plus the `deliver-to-connections.<node>` topic label derived
          # from it). Whichever limit is reached first wins, which is the behaviour wanted here.
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=14d
            - --storage.tsdb.retention.size=768MB
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
