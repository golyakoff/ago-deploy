apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  # Recreate, not the default RollingUpdate: this Deployment owns a ReadWriteOnce PVC, and on a
  # single node that claim does not stop two pods mounting the same directory - the *application's*
  # own single-writer lock is what fails instead. Found live 2026-08-25, when a config change to
  # Prometheus produced a new pod crash-looping on "lock DB directory: resource temporarily
  # unavailable" while the old one held it, and the old one was never terminated because the new one
  # never became ready. A rollout that can never complete. Recreate accepts a moment of downtime,
  # which is the honest cost of one node and one copy of the data.
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      # `17-05`: same shape as postgres.yaml - the entrypoint starts as root and drops to the image's
      # own `redis` account, which is uid 999 **gid 1000** (not 999; read out of the running container
      # with `id redis` rather than assumed, because that mismatch is exactly the guess that produces
      # an unreadable dump.rdb). Unlike Postgres this one tolerates a read-only root filesystem:
      # everything it writes goes to the /data PVC.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: 64Mi
              cpu: 100m
            limits:
              memory: 128Mi
              cpu: 250m
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
