apiVersion: apps/v1
kind: Deployment
metadata:
  name: ago-chat-webhooks
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ago-chat-webhooks
  template:
    metadata:
      labels:
        app: ago-chat-webhooks
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: webhooks
          image: ago-chat-webhooks:local
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              # nfr.md has no Webhooks budget yet (only Api and Worker) - reusing Worker's ceiling
              # as a placeholder, since this host is Worker-shaped (a background dispatcher), not a
              # measured number. Flag this gap when nfr.md gets its Stage 6 pass.
              memory: 512Mi
              cpu: 1000m
          startupProbe:
            httpGet:
              path: /healthz/ready
              port: 8080
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 8080
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: ago-chat-webhooks
spec:
  selector:
    app: ago-chat-webhooks
  ports:
    - port: 80
      targetPort: 8080
