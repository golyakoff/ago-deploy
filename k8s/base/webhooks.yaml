apiVersion: apps/v1
kind: Deployment
metadata:
  name: ago-chat-webhooks
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ago-chat-webhooks
  template:
    metadata:
      labels:
        app: ago-chat-webhooks
    spec:
      terminationGracePeriodSeconds: 30
      # `17-05`: stated, not inherited. The chiseled base (`8-00`) already defaults to a non-root user -
      # verified live on the demo node, the container's runtime spec reports uid/gid 1654 - and that is
      # exactly the problem this block fixes: a base-image change would have reversed it silently and
      # nothing here would have objected. Naming 1654 turns a silent reversal into a pod that will not
      # start. `readOnlyRootFilesystem` costs one emptyDir at /tmp and nothing else: this host writes no
      # files of its own (attachment bytes never pass through it - `file-storage.md`).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhooks
          image: ago-chat-webhooks:local
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          # `7-03`: found while verifying this item's own Done-when live - this container previously had
          # no env/envFrom block at all, so ChatModule.ConfigureServices (AGO_CHAT_CONNECTION_STRING,
          # Messaging:RabbitMq, Redis:ConnectionString - all required for every host, api.yaml/
          # worker.yaml's own comments have the detail) and WebhookSecretCipherOptions
          # (Webhooks:SecretEncryptionKey) would fail ValidateOnStart and crash-loop the pod before ever
          # reaching a healthz endpoint. Pre-existing gap, unrelated to 7-01/7-02/7-03's own scope -
          # fixed here only because a healthy Webhooks pod is this item's own Done-when bar (Prometheus's
          # targets page showing all three Ago.Chat.* hosts). Same values worker.yaml already uses.
          envFrom:
            - secretRef:
                name: infra-credentials
          env:
            - name: AGO_CHAT_CONNECTION_STRING
              value: "Host=postgres;Port=5432;Database=$(POSTGRES_DB);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD)"
            - name: Messaging__RabbitMq__HostName
              value: "rabbitmq"
            - name: Messaging__RabbitMq__UserName
              value: "$(RABBITMQ_USER)"
            - name: Messaging__RabbitMq__Password
              value: "$(RABBITMQ_PASSWORD)"
            - name: Redis__ConnectionString
              value: "redis:6379"
            - name: Storage__S3__ServiceUrl
              value: "http://minio:9000"
            - name: Storage__S3__AccessKey
              value: "$(MINIO_ROOT_USER)"
            - name: Storage__S3__SecretKey
              value: "$(MINIO_ROOT_PASSWORD)"
            - name: Storage__S3__Bucket
              value: "attachments"
            # Same throwaway local dev value appsettings.Development.json already commits in plain text
            # for the fast loop (Ago.Chat.Webhooks/appsettings.Development.json) - not a real secret,
            # following that file's own existing precedent rather than inventing a second pattern here.
            #
            # `17-03` open finding - "not a real secret" stopped being true when base/ started serving
            # overlays/demo. See base/api.yaml's comment on this variable and ago-root
            # docs/architecture/secrets.md, "Open finding".
            - name: Webhooks__SecretEncryptionKey
              value: "Vg1G2KjonUB1uH8trETJzr30EPoeqt0YRGzYibDKy1o="
            # `7-03`: same requirement as ago-chat-api - see that manifest's own comment.
            - name: Otel__Exporter__Endpoint
              value: "http://jaeger:4317"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              # nfr.md has no Webhooks budget yet (only Api and Worker) - reusing Worker's ceiling
              # as a placeholder, since this host is Worker-shaped (a background dispatcher), not a
              # measured number. Flag this gap when nfr.md gets its Stage 6 pass.
              memory: 512Mi
              cpu: 1000m
          startupProbe:
            httpGet:
              path: /healthz/ready
              port: 8080
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 8080
            periodSeconds: 10
          lifecycle:
            preStop:
              # `17-05`: this was `exec: ["sh", "-c", "sleep 5"]` and **it had never once run.** The
              # chiseled base image (`8-00`) contains no shell and no coreutils - `kubectl exec ... --
              # true` in a running pod answers `executable file not found in $PATH` - so every
              # termination since this hook was written logged a `FailedPreStopHook` event and went
              # straight to SIGTERM. A failing preStop hook does not fail a rollout, which is why it
              # stayed invisible: `3-06`'s rolling-deploy verification watched for lost messages and
              # readiness flapping, and saw neither, because a single replica draining slightly early
              # loses nothing a client will notice.
              #
              # `sleep` is Kubernetes' own preStop action (GA since 1.30), executed by the kubelet
              # rather than inside the container, so it needs nothing from the image at all. Same
              # duration, same reasoning as before - see the comment below and `edge.md` - now
              # actually applied. Verified live: a rollout of a pod carrying this form produces no
              # `FailedPreStopHook` event, where the previous form produced one every time.
              sleep:
                seconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ago-chat-webhooks
spec:
  selector:
    app: ago-chat-webhooks
  ports:
    - port: 80
      targetPort: 8080
