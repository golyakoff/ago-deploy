apiVersion: apps/v1
kind: Deployment
metadata:
  name: ago-chat-worker
spec:
  # An ordinary capacity choice again, as of `14-16`/`adr/0089` (2026-09-02). The warning that stood
  # here - that raising this would permanently break inbound Telegram and MAX, because the two long-poll
  # services were unstated singletons - is obsolete: poll ownership is now claimed per
  # `ChannelCredentialId` by a session-scoped PostgreSQL advisory lock, so several Worker replicas share
  # the bot fleet instead of fighting over it. `concurrency.md` carries the mechanism.
  #
  # Raising it is therefore safe but still not automatic: it is a throughput decision and this project
  # requires a load-test number for those rather than an assertion. One replica is what the demo needs.
  replicas: 1
  selector:
    matchLabels:
      app: ago-chat-worker
  template:
    metadata:
      labels:
        app: ago-chat-worker
    spec:
      terminationGracePeriodSeconds: 30
      # `17-05`: stated, not inherited. The chiseled base (`8-00`) already defaults to a non-root user -
      # verified live on the demo node, the container's runtime spec reports uid/gid 1654 - and that is
      # exactly the problem this block fixes: a base-image change would have reversed it silently and
      # nothing here would have objected. Naming 1654 turns a silent reversal into a pod that will not
      # start. `readOnlyRootFilesystem` costs one emptyDir at /tmp and nothing else: this host writes no
      # files of its own (attachment bytes never pass through it - `file-storage.md`).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ago-chat-worker:local
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080 # health endpoint only - this host has no business HTTP surface
          envFrom:
            - secretRef:
                name: infra-credentials
          env:
            # `ago-root#354`: same reasoning as api.yaml's own comment, set uniformly across every
            # serving host rather than only where a dev-only route is mapped today - a manifest that
            # only carries this where it currently matters is one refactor away (a future dev-only
            # route added to this host) from inheriting an unstated framework default again.
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            # Same requirement as ago-chat-api - see the comment there.
            - name: AGO_CHAT_CONNECTION_STRING
              value: "Host=postgres;Port=5432;Database=$(POSTGRES_DB);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD)"
            - name: Messaging__RabbitMq__HostName
              value: "rabbitmq"
            - name: Messaging__RabbitMq__UserName
              value: "$(RABBITMQ_USER)"
            - name: Messaging__RabbitMq__Password
              value: "$(RABBITMQ_PASSWORD)"
            # `4-04`: OperatorDisconnectGraceConsumer/OperatorDisconnectSweepJob read presence via
            # IConnectionRegistry, which ChatModule.ConfigureServices wires up unconditionally for
            # every host (same AddConnectionRegistry call api.yaml's own Redis__ConnectionString
            # comment describes) - missing here since 4-04 shipped, found live while verifying
            # `5-10` (this host crashed at startup with "Set Redis:ConnectionString").
            - name: Redis__ConnectionString
              value: "redis:6379"
            # `7-03`: same finding as ago-chat-api's own comment - S3StorageOptions/
            # WebhookSecretCipherOptions are validated for every host, and this manifest never carried
            # them. Pre-existing gap since `5-02`/`6-05`, fixed here only because a healthy pod is this
            # item's own Done-when bar.
            - name: Storage__S3__ServiceUrl
              value: "http://minio:9000"
            - name: Storage__S3__AccessKey
              value: "$(MINIO_ROOT_USER)"
            - name: Storage__S3__SecretKey
              value: "$(MINIO_ROOT_PASSWORD)"
            - name: Storage__S3__Bucket
              value: "attachments"
            # `17-03` open finding - see base/api.yaml's own comment on this variable, and ago-root
            # docs/architecture/secrets.md. Not a throwaway value once base/ serves overlays/demo.
            - name: Webhooks__SecretEncryptionKey
              value: "Vg1G2KjonUB1uH8trETJzr30EPoeqt0YRGzYibDKy1o="
            # `14-02`/`adr/0069`: same requirement as ago-chat-api - see that manifest's own comment.
            - name: Channels__CredentialEncryptionKey
              value: "$(CHANNELS_CREDENTIAL_ENCRYPTION_KEY)"
            # `13-02`: same requirement as ago-chat-api - see that manifest's own comment (STUB, no
            # real ЮKassa merchant account yet).
            # `25-29`: split into ago-business decision 0012's base-plus-marginal formula - see
            # api.yaml's own comment for the reasoning. Both keys ship together everywhere.
            - name: Billing__BaseSeatPriceRub
              value: "490"
            - name: Billing__PricePerExtraSeatRub
              value: "200"
            - name: Billing__CheckoutReturnUrl
              value: "https://office.reserve-me.ru/settings/billing"
            # `25-73`/api.yaml's own remarks: `[Required]` on `ago-chat`'s side, never set on this
            # host either - found the same way, the same night.
            - name: OperatorInvite__ConsoleBaseUrl
              value: "https://office.reserve-me.ru"
            - name: Billing__YooKassa__ShopId
              value: "STUB-NOT-A-REAL-YOOKASSA-ACCOUNT"
            - name: Billing__YooKassa__SecretKey
              value: "stub-no-real-secret-key-configured"
            - name: Billing__YooKassa__WebhookKey
              value: "stub-no-real-webhook-key-configured"
            # `23-86`/`adr/0159`: the option-to-entitlement mapping - `IBillingOptionEntitlementProvider.TryGet()`
            # reads this generically by whatever billing option key a caller names, so a second priced
            # option needs only a second line here, never a code change in `Ago.Chat.*` - see that
            # port's own remarks for why it is not a fixed-property options class. A literal option key
            # is fine in this file for the identical reason `ModuleEntryPoints__calendar` below is fine
            # in `api.yaml`: this repository is not `Ago.Chat.*`, the architecture guard never scans it,
            # and a literal key here is exactly what "the deployment declares the mapping" means.
            # Carries no price, on purpose - `IBillingOptionEntitlementProvider`'s own remarks: "the
            # deployment declares what an option turns on, never what it costs"; the price list itself
            # lives in the private `ago-business` repository and never enters this one.
            #
            # `channel-telegram` -> `channel`, not `calendar`/`faq`: this item's own Scope (and
            # `docs/architecture/entitlements-and-subscriptions.md`'s own "a billing grant is not yet
            # sufficient to turn on a module that requires registration") rules those two out - a
            # billing-driven grant writes a `ModuleQuantityGrant` with no entry point, no credential and
            # no synchronous module-side registration call, so pointing this mapping at either would
            # leave chat believing the module is granted while nothing routes to it. `channel` needs
            # none of that: it is a quantity grant only, the identical shape this option already writes.
            #
            # **Corrected, found live 2026-09-16**: this used to say only `Ago.Chat.Worker` needs this
            # variable, because `SubscriptionRenewalApplier` (`Ago.Chat.Infrastructure.Postgres`,
            # resolved inside `SubscriptionRenewalJob`) was this deployment's only caller of
            # `IBillingOptionEntitlementProvider.TryGet()` when `23-86` wrote that sentence. `23-85`
            # added a second, real caller in `Ago.Chat.Api` (`ChannelEntitlement.IsEntitledAsync`, read
            # by `RegisterChannelCredentialHandler`/`RevokeChannelCredentialHandler`/
            # `GetChannelCredentialStatusHandler`) and nobody updated this deployment for it - a real,
            # live gap (no channel entitlement the owner ever granted could reach a tenant's own connect
            # attempt), not a hypothetical one. `api.yaml` now carries the identical line.
            #
            # `25-115`: bumped from the legacy shared `"channel"` value to `"channel-telegram"`, and
            # `Max`/`Vk`/`WhatsApp`/`Avito` added alongside it - `api.yaml`'s own comment on this same
            # change has the full reasoning; `api.yaml` and this file must keep carrying identical lines.
            - name: BillingOptionEntitlements__channel-telegram
              value: "channel-telegram"
            - name: BillingOptionEntitlements__channel-max
              value: "channel-max"
            - name: BillingOptionEntitlements__channel-vk
              value: "channel-vk"
            - name: BillingOptionEntitlements__channel-whatsapp
              value: "channel-whatsapp"
            - name: BillingOptionEntitlements__channel-avito
              value: "channel-avito"
            # `7-03`: same requirement as ago-chat-api - see the comment there.
            # `8-07`/ago-root `adr/0058`: the demo-tenant minting path. **Off here, on purpose.** An
            # endpoint that creates tenants from the public internet is not something a host should
            # acquire by upgrading, and only the demo deployment wants it - overlays/demo patches this
            # to "true" and supplies the origin. While it is false the Keycloak credential below is not
            # required either (see AddKeycloakDemoIdentities), which is what lets the local loop and any
            # real customer's installation run with none of it configured.
            - name: DemoTenant__Enabled
              value: "false"
            - name: DemoTenant__VisitorOrigin
              value: "http://localhost:3000"
            - name: Keycloak__Admin__BaseUrl
              value: "http://keycloak:8080"
            - name: Keycloak__Admin__Realm
              value: "ago-chat"
            - name: Keycloak__Admin__ClientId
              value: "ago-demo-provisioner"
            # The one credential in this system that lets a web-facing process write to the identity
            # provider (`17-03`'s inventory). Applied to the realm by k8s/apply-demo-provisioner.sh,
            # which also grants the service account its single role.
            - name: Keycloak__Admin__ClientSecret
              value: "$(KEYCLOAK_DEMO_PROVISIONER_SECRET)"
            - name: Otel__Exporter__Endpoint
              value: "http://jaeger:4317"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi # nfr.md's Worker pod budget at target load
              cpu: 1000m
          startupProbe:
            httpGet:
              path: /healthz/ready
              port: 8080
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 8080
            periodSeconds: 10
          lifecycle:
            preStop:
              # `17-05`: this was `exec: ["sh", "-c", "sleep 5"]` and **it had never once run.** The
              # chiseled base image (`8-00`) contains no shell and no coreutils - `kubectl exec ... --
              # true` in a running pod answers `executable file not found in $PATH` - so every
              # termination since this hook was written logged a `FailedPreStopHook` event and went
              # straight to SIGTERM. A failing preStop hook does not fail a rollout, which is why it
              # stayed invisible: `3-06`'s rolling-deploy verification watched for lost messages and
              # readiness flapping, and saw neither, because a single replica draining slightly early
              # loses nothing a client will notice.
              #
              # `sleep` is Kubernetes' own preStop action (GA since 1.30), executed by the kubelet
              # rather than inside the container, so it needs nothing from the image at all. Same
              # duration, same reasoning as before - see the comment below and `edge.md` - now
              # actually applied. Verified live: a rollout of a pod carrying this form produces no
              # `FailedPreStopHook` event, where the previous form produced one every time.
              sleep:
                seconds: 5
              # Placeholder until Stage 2 adds the real drain (stop claiming new outbox batches,
              # let in-flight ones finish) - see concurrency.md.
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ago-chat-worker
spec:
  selector:
    app: ago-chat-worker
  ports:
    - port: 80
      targetPort: 8080
