apiVersion: apps/v1
kind: Deployment
metadata:
  name: ago-chat-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ago-chat-worker
  template:
    metadata:
      labels:
        app: ago-chat-worker
    spec:
      terminationGracePeriodSeconds: 30
      # `17-05`: stated, not inherited. The chiseled base (`8-00`) already defaults to a non-root user -
      # verified live on the demo node, the container's runtime spec reports uid/gid 1654 - and that is
      # exactly the problem this block fixes: a base-image change would have reversed it silently and
      # nothing here would have objected. Naming 1654 turns a silent reversal into a pod that will not
      # start. `readOnlyRootFilesystem` costs one emptyDir at /tmp and nothing else: this host writes no
      # files of its own (attachment bytes never pass through it - `file-storage.md`).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ago-chat-worker:local
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080 # health endpoint only - this host has no business HTTP surface
          envFrom:
            - secretRef:
                name: infra-credentials
          env:
            # Same requirement as ago-chat-api - see the comment there.
            - name: AGO_CHAT_CONNECTION_STRING
              value: "Host=postgres;Port=5432;Database=$(POSTGRES_DB);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD)"
            - name: Messaging__RabbitMq__HostName
              value: "rabbitmq"
            - name: Messaging__RabbitMq__UserName
              value: "$(RABBITMQ_USER)"
            - name: Messaging__RabbitMq__Password
              value: "$(RABBITMQ_PASSWORD)"
            # `4-04`: OperatorDisconnectGraceConsumer/OperatorDisconnectSweepJob read presence via
            # IConnectionRegistry, which ChatModule.ConfigureServices wires up unconditionally for
            # every host (same AddConnectionRegistry call api.yaml's own Redis__ConnectionString
            # comment describes) - missing here since 4-04 shipped, found live while verifying
            # `5-10` (this host crashed at startup with "Set Redis:ConnectionString").
            - name: Redis__ConnectionString
              value: "redis:6379"
            # `7-03`: same finding as ago-chat-api's own comment - S3StorageOptions/
            # WebhookSecretCipherOptions are validated for every host, and this manifest never carried
            # them. Pre-existing gap since `5-02`/`6-05`, fixed here only because a healthy pod is this
            # item's own Done-when bar.
            - name: Storage__S3__ServiceUrl
              value: "http://minio:9000"
            - name: Storage__S3__AccessKey
              value: "$(MINIO_ROOT_USER)"
            - name: Storage__S3__SecretKey
              value: "$(MINIO_ROOT_PASSWORD)"
            - name: Storage__S3__Bucket
              value: "attachments"
            - name: Webhooks__SecretEncryptionKey
              value: "Vg1G2KjonUB1uH8trETJzr30EPoeqt0YRGzYibDKy1o="
            # `7-03`: same requirement as ago-chat-api - see the comment there.
            # `8-07`/ago-root `adr/0058`: the demo-tenant minting path. **Off here, on purpose.** An
            # endpoint that creates tenants from the public internet is not something a host should
            # acquire by upgrading, and only the demo deployment wants it - overlays/demo patches this
            # to "true" and supplies the origin. While it is false the Keycloak credential below is not
            # required either (see AddKeycloakDemoIdentities), which is what lets the local loop and any
            # real customer's installation run with none of it configured.
            - name: DemoTenant__Enabled
              value: "false"
            - name: DemoTenant__VisitorOrigin
              value: "http://localhost:3000"
            - name: Keycloak__Admin__BaseUrl
              value: "http://keycloak:8080"
            - name: Keycloak__Admin__Realm
              value: "ago-chat"
            - name: Keycloak__Admin__ClientId
              value: "ago-demo-provisioner"
            # The one credential in this system that lets a web-facing process write to the identity
            # provider (`17-03`'s inventory). Applied to the realm by k8s/apply-demo-provisioner.sh,
            # which also grants the service account its single role.
            - name: Keycloak__Admin__ClientSecret
              value: "$(KEYCLOAK_DEMO_PROVISIONER_SECRET)"
            - name: Otel__Exporter__Endpoint
              value: "http://jaeger:4317"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi # nfr.md's Worker pod budget at target load
              cpu: 1000m
          startupProbe:
            httpGet:
              path: /healthz/ready
              port: 8080
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 8080
            periodSeconds: 10
          lifecycle:
            preStop:
              # `17-05`: this was `exec: ["sh", "-c", "sleep 5"]` and **it had never once run.** The
              # chiseled base image (`8-00`) contains no shell and no coreutils - `kubectl exec ... --
              # true` in a running pod answers `executable file not found in $PATH` - so every
              # termination since this hook was written logged a `FailedPreStopHook` event and went
              # straight to SIGTERM. A failing preStop hook does not fail a rollout, which is why it
              # stayed invisible: `3-06`'s rolling-deploy verification watched for lost messages and
              # readiness flapping, and saw neither, because a single replica draining slightly early
              # loses nothing a client will notice.
              #
              # `sleep` is Kubernetes' own preStop action (GA since 1.30), executed by the kubelet
              # rather than inside the container, so it needs nothing from the image at all. Same
              # duration, same reasoning as before - see the comment below and `edge.md` - now
              # actually applied. Verified live: a rollout of a pod carrying this form produces no
              # `FailedPreStopHook` event, where the previous form produced one every time.
              sleep:
                seconds: 5
              # Placeholder until Stage 2 adds the real drain (stop claiming new outbox batches,
              # let in-flight ones finish) - see concurrency.md.
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ago-chat-worker
spec:
  selector:
    app: ago-chat-worker
  ports:
    - port: 80
      targetPort: 8080
