apiVersion: apps/v1
kind: Deployment
metadata:
  name: ago-chat-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ago-chat-worker
  template:
    metadata:
      labels:
        app: ago-chat-worker
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: ago-chat-worker:local
          ports:
            - containerPort: 8080 # health endpoint only - this host has no business HTTP surface
          envFrom:
            - secretRef:
                name: infra-credentials
          env:
            # Same requirement as ago-chat-api - see the comment there.
            - name: AGO_CHAT_CONNECTION_STRING
              value: "Host=postgres;Port=5432;Database=$(POSTGRES_DB);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD)"
            - name: Messaging__RabbitMq__HostName
              value: "rabbitmq"
            - name: Messaging__RabbitMq__UserName
              value: "$(RABBITMQ_USER)"
            - name: Messaging__RabbitMq__Password
              value: "$(RABBITMQ_PASSWORD)"
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi # nfr.md's Worker pod budget at target load
              cpu: 1000m
          startupProbe:
            httpGet:
              path: /healthz/ready
              port: 8080
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 8080
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                # Placeholder until Stage 2 adds the real drain (stop claiming new outbox batches,
                # let in-flight ones finish) - see concurrency.md.
                command: ["sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: ago-chat-worker
spec:
  selector:
    app: ago-chat-worker
  ports:
    - port: 80
      targetPort: 8080
