# `26-131`: the Android design mini-site - `ago-android-design`, a separate repository (like
# `ago-brandbook`, on which this is modelled exactly): a multi-page static design reference for the
# Android client, split out of the single mockup Artifact. Public but unadvertised - no auth gate,
# same as brandbook, and linked from nowhere. Same no-build-step static-file image shape as every
# other Deployment in this file's own family (mirrors `brandbook-static.yaml` exactly).
#
# Demo-overlay-only, not k8s/base/ - like the brand-book page, this subdomain has no meaning in a
# local Docker-Desktop cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ago-android-design
spec:
  replicas: 1 # a static bundle behind nginx, no state to scale for - same reasoning as every other demo-overlay static site
  selector:
    matchLabels:
      app: ago-android-design
  template:
    metadata:
      labels:
        app: ago-android-design
    spec:
      # `17-05`: identical to brandbook-static.yaml's/console-static.yaml's own block - read it there
      # for why the nginx master is still root, what the five kept capabilities are each for, and
      # which repository would have to change to fix it properly.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ago-android-design
          # Rewritten by this overlay's own `images:` block to
          # ghcr.io/golyakoff/ago-android-design:<40-char commit SHA>, published by
          # ago-android-design's own CI. No `imagePullPolicy: Never`; see console-static.yaml.
          image: ago-android-design:local
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETGID", "SETUID", "NET_BIND_SERVICE", "KILL"]
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: 32Mi
              cpu: 25m
            limits:
              memory: 64Mi
              cpu: 100m
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ago-android-design
spec:
  selector:
    app: ago-android-design
  ports:
    - port: 80
      targetPort: 80
