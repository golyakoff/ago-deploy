# `25-180`: the public brand-identity reference page - `ago-brandbook`, a separate repository from
# `ago-console`/`ago-widget`/`ago-landing` (repositories.md: "each deployable surface gets its own
# repo" - this page documents the platform's own visual identity, it is not any one product's
# marketing page or demo/console surface). Same no-build-step static-file image shape as every other
# Deployment in this file's own family (mirrors `landing-static.yaml` exactly).
#
# Demo-overlay-only, not k8s/base/ - like the apex landing page, this subdomain has no meaning in a
# local Docker-Desktop cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ago-brandbook
spec:
  replicas: 1 # a static bundle behind nginx, no state to scale for - same reasoning as every other demo-overlay static site
  selector:
    matchLabels:
      app: ago-brandbook
  template:
    metadata:
      labels:
        app: ago-brandbook
    spec:
      # `17-05`: identical to console-static.yaml's/landing-static.yaml's own block - read it there
      # for why the nginx master is still root, what the five kept capabilities are each for, and
      # which repository would have to change to fix it properly.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ago-brandbook
          # Rewritten by this overlay's own `images:` block to
          # ghcr.io/golyakoff/ago-brandbook:<40-char commit SHA>, published by ago-brandbook's own
          # CI. No `imagePullPolicy: Never`; see console-static.yaml for the reasoning.
          image: ago-brandbook:local
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETGID", "SETUID", "NET_BIND_SERVICE", "KILL"]
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: 32Mi
              cpu: 25m
            limits:
              memory: 64Mi
              cpu: 100m
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ago-brandbook
spec:
  selector:
    app: ago-brandbook
  ports:
    - port: 80
      targetPort: 80
