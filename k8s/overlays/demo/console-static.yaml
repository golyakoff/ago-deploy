# 8-02: the ago-console static bundle, behind the Gateway's already-existing
# console.reserve-me.ru HTTPRoute (gateway.yaml, designed ahead of this file by 8-01 - its own
# comment says "the Service and bundle are 8-02's job"). This Service's name/port (ago-console:80)
# match that route's backendRef exactly, so no change to gateway.yaml is needed to wire it up.
#
# Demo-overlay-only, not k8s/base/ - local dev never runs this in a cluster (local-dev.md's
# "Running the console locally" section already serves it with a plain `npm run dev`), so there is
# no overlays/local counterpart this would need to stay consistent with, unlike the shared
# Ago.Chat.* Deployments in base/.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ago-console
spec:
  replicas: 1 # a static bundle behind nginx - no state, no reason to scale this demo cluster's own dashboard-equivalent beyond one pod
  selector:
    matchLabels:
      app: ago-console
  template:
    metadata:
      labels:
        app: ago-console
    spec:
      # `17-05`. **This container's nginx master process is still root, and no field below changes
      # that.** The image is built FROM `nginx:1.27-alpine-slim`, whose master runs as root and binds
      # :80; making it non-root means either the `nginxinc/nginx-unprivileged` base (listens on 8080)
      # or a `USER` plus a config that does - both of which are changes to the image, in
      # `ago-console`/`ago-widget`/`ago-landing`, and both of which move the Service and route target
      # ports with them. `17-05` deliberately did not make them from `ago-deploy`; the exact per-
      # repository change is written down in `ago-root`'s `docs/backlog/17-05-*`.
      #
      # What the manifest *can* do, it does, and it is not nothing: the root master keeps five
      # capabilities out of fourteen, cannot gain more, and cannot write to its own image. That last
      # one is the control with teeth here - before it, `ago-console` could write a file into
      # /usr/share/nginx/html and the public internet would be served it (done live, then undone).
      #
      # The five kept capabilities are each load-bearing for nginx-as-root, not a copied list:
      # NET_BIND_SERVICE to bind :80, SETUID/SETGID to drop the workers to the `nginx` user,
      # CHOWN because nginx chowns the temp directories it creates under /var/cache/nginx to that
      # user, and KILL because a root master signalling workers that run as another uid needs it.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ago-console
          # `15-07`/`adr/0051`: the overlay's `images:` block rewrites this to
          # ghcr.io/golyakoff/ago-console:<40-char commit SHA>. The bare name stays here, and stays
          # `:local`, so that overlays built without that block - and a plain `docker build` loop -
          # still resolve to something meaningful.
          #
          # The `imagePullPolicy: Never` that used to sit on this line is gone, and with it the
          # comment explaining that the four static bundles could not name their commits. That
          # comment was the honest record of 15-06's own gap: **the 2026-08-25 incident was this
          # bundle** - the console served a week-old page and nothing about the running pod could
          # say so. It can now: the image is published by ago-console's CI under its commit, and the
          # container serves that commit at /version.json, which smoke.sh checks on every run.
          #
          # The default policy for a non-`:latest` tag is IfNotPresent, which is exactly right for
          # an immutable SHA tag: present in containerd it is used with no network call - so a node
          # that built its own image behaves as it always did - and absent, it is pulled. `Never`
          # cannot do the second half, and the second half is what lets a rebuilt cluster start.
          image: ago-console:local
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETGID", "SETUID", "NET_BIND_SERVICE", "KILL"]
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
          resources:
            # Static nginx serving a ~370KB bundle - a small, fixed footprint, nowhere near
            # api.yaml's own budget (adr/0026's sizing math already accounts for "a lightweight
            # server, tens of MB, not hundreds").
            requests:
              memory: 32Mi
              cpu: 25m
            limits:
              memory: 64Mi
              cpu: 100m
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ago-console
spec:
  selector:
    app: ago-console
  ports:
    - port: 80
      targetPort: 80
