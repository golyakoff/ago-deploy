# 8-02: the public demo landing page + the widget's own built bundle, served together from one
# origin (demo-shop1.reserve-me.ru) - the demo page's <script src="./widget.js" ...> tag depends
# on both being same-origin, which this single Deployment/Service/image guarantees by construction
# rather than by convention. demo-shop2-static.yaml is a second, independent copy of this same
# shape (own image tag, own site) - deliberately not parameterized into one shared template, since
# a second literal file is what a reader compares against this one to see exactly what differs.
#
# Demo-overlay-only, not k8s/base/ - same reasoning as console-static.yaml: nothing in
# overlays/local ever serves this over a cluster Service, `ago-widget`'s own local-dev.md flow
# (`npx serve`) already covers the local loop entirely outside Kubernetes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ago-demo-shop1
spec:
  replicas: 1 # same reasoning as ago-console above - a static bundle behind nginx, no state to scale for
  selector:
    matchLabels:
      app: ago-demo-shop1
  template:
    metadata:
      labels:
        app: ago-demo-shop1
    spec:
      # `17-05`: identical to console-static.yaml's own block - read it there for why the nginx
      # master is still root, what the five kept capabilities are each for, and which repository
      # would have to change to fix it properly.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ago-demo-shop1
          # `15-07`/`adr/0051`: rewritten by the overlay's `images:` block to
          # ghcr.io/golyakoff/ago-demo-shop1:<40-char commit SHA>, published by ago-widget's CI. No
          # `imagePullPolicy: Never` any more - see console-static.yaml for the reasoning, which is
          # identical here. The served bundle names its own commit twice over: /version.json beside
          # it, and `window.AgoChat.commit` inside it, which is the copy that survives being embedded
          # on a tenant's own page where none of our files sit alongside it.
          image: ago-demo-shop1:local
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETGID", "SETUID", "NET_BIND_SERVICE", "KILL"]
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: 32Mi
              cpu: 25m
            limits:
              memory: 64Mi
              cpu: 100m
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ago-demo-shop1
spec:
  selector:
    app: ago-demo-shop1
  ports:
    - port: 80
      targetPort: 80
