# A second, independent demo tenant (demo-shop2.reserve-me.ru) - same image build as
# demo-shop1-static.yaml (the widget bundle is identical; only the embedded demo page differs,
# `ago-widget/Dockerfile`'s `DEMO_PAGE_DIR` build arg), a different `ago-demo-shop2:local` tag, its
# own site row and operator (`ago-deploy/seed`). Exists specifically to demonstrate tenant isolation
# live: two visibly different shops, two separate operator logins, no shared data.
#
# Demo-overlay-only, not k8s/base/ - same reasoning as demo-shop1-static.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ago-demo-shop2
spec:
  replicas: 1 # same reasoning as ago-demo-shop1 - a static bundle behind nginx, no state to scale for
  selector:
    matchLabels:
      app: ago-demo-shop2
  template:
    metadata:
      labels:
        app: ago-demo-shop2
    spec:
      # `17-05`: identical to console-static.yaml's own block - read it there for why the nginx
      # master is still root, what the five kept capabilities are each for, and which repository
      # would have to change to fix it properly.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ago-demo-shop2
          # `15-07`/`adr/0051`: rewritten by the overlay's `images:` block to
          # ghcr.io/golyakoff/ago-demo-shop2:<40-char commit SHA>, published by ago-widget's CI from
          # the same Dockerfile as demo-shop1 with DEMO_PAGE_DIR=public-demo-2. The two images share
          # a commit and differ in name, never in tag - which is what keeps both SHA tags truthful.
          # No `imagePullPolicy: Never` any more; see console-static.yaml for the reasoning.
          image: ago-demo-shop2:local
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETGID", "SETUID", "NET_BIND_SERVICE", "KILL"]
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: 32Mi
              cpu: 25m
            limits:
              memory: 64Mi
              cpu: 100m
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ago-demo-shop2
spec:
  selector:
    app: ago-demo-shop2
  ports:
    - port: 80
      targetPort: 80
