# A second, independent demo tenant (demo-shop2.reserve-me.ru) - same image build as
# demo-shop1-static.yaml (the widget bundle is identical; only the embedded demo page differs,
# `ago-widget/Dockerfile`'s `DEMO_PAGE_DIR` build arg), a different `ago-demo-shop2:local` tag, its
# own site row and operator (`ago-deploy/seed`). Exists specifically to demonstrate tenant isolation
# live: two visibly different shops, two separate operator logins, no shared data.
#
# Demo-overlay-only, not k8s/base/ - same reasoning as demo-shop1-static.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ago-demo-shop2
spec:
  replicas: 1 # same reasoning as ago-demo-shop1 - a static bundle behind nginx, no state to scale for
  selector:
    matchLabels:
      app: ago-demo-shop2
  template:
    metadata:
      labels:
        app: ago-demo-shop2
    spec:
      containers:
        - name: ago-demo-shop2
          image: ago-demo-shop2:local
          # adr/0026's "no registry" image delivery, same as demo-shop1-static.yaml above -
          # k8s/build-static-images.sh builds and imports this tag directly on the VPS.
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: 32Mi
              cpu: 25m
            limits:
              memory: 64Mi
              cpu: 100m
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ago-demo-shop2
spec:
  selector:
    app: ago-demo-shop2
  ports:
    - port: 80
      targetPort: 80
