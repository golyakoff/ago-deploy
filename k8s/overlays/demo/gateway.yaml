# adr/0026, as amended by adr/0091: the public edge. chat.reserve-me.ru is the operator console and
# chat-api.reserve-me.ru is the API - console.reserve-me.ru is retired. Also auth.reserve-me.ru,
# demo-shop1.reserve-me.ru/demo-shop2.reserve-me.ru (`8-02`/`8-05` - a
# second, independent tenant seeded specifically to demonstrate tenant isolation live), and the
# domain's own apex, reserve-me.ru (the public marketing page, `ago-landing` - a separate
# repository, repositories.md's "each deployable surface gets its own repo" pattern; a Gateway API
# wildcard hostname matches subdomains only, never the bare apex, hence its own listener pair rather
# than a route on the wildcard ones). Same NGINX Gateway Fabric component as overlays/local/
# (adr/0014) - only the listeners, hostnames, and TLS wiring differ.
#
# **grafana.reserve-me.ru was removed 2026-08-25.** It had a listener and an HTTPRoute here, on the
# author's own 2026-08-24 call: public Grafana over an SSH tunnel, for reachability without a live
# session, gated by Grafana's own login plus TLS rather than by network topology. Reversed for two
# reasons that were not in view then. It is an admin UI behind a single shared password with no second
# factor and no lockout, and (`17-04`) nothing in this project watches for a published vulnerability in
# anything it ships - so a permanently internet-facing admin surface is one whose next CVE nobody would
# hear about. And the need it served - looking at dashboards without a live session - is served by an
# SSH tunnel that costs one command, documented in ago-root's runbooks/public-deploy.md.
#
# Grafana was never the answer to "is it alive" anyway: it runs inside the thing it watches, so it
# cannot report the failure that matters most. That question is an external check against
# chat.reserve-me.ru/healthz/ready, which already exercises Postgres, RabbitMQ and Redis (ago-root's
# backlog/15-03).
#
# The console's own listener/HTTPRoute below were designed by 8-01 ahead of this item - 8-02 only had
# to create the `ago-console` Service (console-static.yaml) the existing backendRef already names;
# nothing in this file needed to change for that route to start working. The name it answers on has
# since changed from console. to chat. (adr/0091); the Service and the route are the same ones.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ago-chat-gateway
spec:
  gatewayClassName: nginx
  # `17-02`: same access-log format as overlays/local/gateway.yaml, and for the same reason - the
  # NginxProxy at the bottom of this file has it. It matters more here: this is the Gateway a real
  # visitor's hub connection actually crosses, and the token in that request's query string was being
  # written to this node's disk in full on every connect.
  infrastructure:
    parametersRef:
      group: gateway.nginx.org
      kind: NginxProxy
      name: ago-chat-gateway-proxy
  listeners:
    # Plain HTTP stays open on every host in this overlay - cert-manager's own gatewayHTTPRoute ACME
    # solver (adr/0026, tls.yaml) answers Let's Encrypt's HTTP-01 challenge through a temporary
    # HTTPRoute it creates itself under this same Gateway, and it needs a working :80 listener to do
    # that. Everything else on :80 redirects to HTTPS (the `http-to-https-redirect` HTTPRoute below) -
    # deferred by 8-01 for lack of a live server to verify against; now there is one (8-02).
    - name: http
      port: 80
      protocol: HTTP
      hostname: "*.reserve-me.ru"
    # A Gateway API wildcard hostname (`*.reserve-me.ru` above) matches subdomains only, never the
    # bare apex - the landing page (ago-landing) lives at the apex itself, so it needs its own
    # listener pair (this one plus `https-landing` below), not just a route on the wildcard ones.
    - name: http-apex
      port: 80
      protocol: HTTP
      hostname: reserve-me.ru
    - name: https-chat
      port: 443
      protocol: HTTPS
      hostname: chat.reserve-me.ru
      tls:
        mode: Terminate
        certificateRefs:
          - name: ago-public-tls
    # The chat API's new, permanent name. Both listeners serve the same API for now, on purpose:
    # `chat.` is what the widget, the console and the landing page's copy-me snippet all point at
    # today, and it becomes the chat *console* at the end of this migration. Serving both first is
    # what makes that flip safe - a consumer can move to `chat-api.` and be verified working before
    # anything about `chat.` changes.
    - name: https-chat-api
      port: 443
      protocol: HTTPS
      hostname: chat-api.reserve-me.ru
      tls:
        mode: Terminate
        certificateRefs:
          - name: ago-public-tls
    - name: https-auth
      port: 443
      protocol: HTTPS
      hostname: auth.reserve-me.ru
      tls:
        mode: Terminate
        certificateRefs:
          - name: ago-public-tls
    # `adr/0091` step 3 completed, 2026-09-03: there is no `https-console` listener any more. The
    # console lives at `chat.reserve-me.ru`, the bare product name, which is the whole point of that
    # decision - `console.` was a role word with no product in it and could not survive a second
    # product having a console too.
    #
    # The ADR planned to keep `console.` for one release as a grace period for bookmarks and links.
    # The author retired it immediately instead, on the ground the grace period was protecting
    # nobody: this is a live demo stand with no tenants, and the only person who ever opened that
    # address was the author. A grace period with no one in it is just a second name to maintain.
    # 8-02: demo-shop1-static.yaml creates the ago-demo-shop1 Service this route's own backendRef
    # names - the public demo landing page + the widget's own built bundle, served together
    # (demo-shop1-static.yaml's own header comment has the same-origin reasoning).
    - name: https-demo-shop1
      port: 443
      protocol: HTTPS
      hostname: demo-shop1.reserve-me.ru
      tls:
        mode: Terminate
        certificateRefs:
          - name: ago-public-tls
    # A second, independent demo tenant (demo-shop2-static.yaml) - same shape as demo-shop1's own
    # listener above, different hostname/Service/site.
    - name: https-demo-shop2
      port: 443
      protocol: HTTPS
      hostname: demo-shop2.reserve-me.ru
      tls:
        mode: Terminate
        certificateRefs:
          - name: ago-public-tls
    # The public marketing page (ago-landing, a separate repository - repositories.md's "each
    # deployable surface gets its own repo" pattern) at the domain's own apex.
    - name: https-landing
      port: 443
      protocol: HTTPS
      hostname: reserve-me.ru
      tls:
        mode: Terminate
        certificateRefs:
          - name: ago-public-tls
    # `20-20`: AGO Calendar's own two listeners. `calendar.` and `calendar-console.` are this item's
    # own working-default hostname proposal, not a settled name - flagged in this item's report, since
    # changing either later costs a DNS record and a certificate SAN, not a rebuild.
    - name: https-calendar
      port: 443
      protocol: HTTPS
      hostname: calendar-api.reserve-me.ru
      tls:
        mode: Terminate
        certificateRefs:
          - name: ago-public-tls
    - name: https-calendar-console
      port: 443
      protocol: HTTPS
      hostname: calendar.reserve-me.ru
      tls:
        mode: Terminate
        certificateRefs:
          - name: ago-public-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
spec:
  parentRefs:
    - name: ago-chat-gateway
      sectionName: http
    - name: ago-chat-gateway
      sectionName: http-apex
  hostnames:
    - "*.reserve-me.ru"
    - reserve-me.ru
  rules:
    # cert-manager's own ACME HTTP-01 solver attaches its own temporary HTTPRoute to this same
    # `http` listener with an *exact* hostname (the specific domain being challenged) and an exact
    # `/.well-known/acme-challenge/<token>` path - Gateway API's own route-precedence rules (exact
    # hostname beats this route's wildcard; exact path beats this rule's PathPrefix) mean that route
    # always wins for its own request without needing to special-case it here.
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ago-chat-api
spec:
  # `adr/0091` step 3, 2026-09-03: `chat.` is gone from here. The API answered on both names for one
  # release so every consumer could move and be verified on `chat-api.` first - the widget's build
  # default, the console's `.env.production`, both demo images, `smoke.sh`. All were moved, deployed
  # and checked live (zero occurrences of the bare `chat.` origin in any served bundle) before this
  # line was deleted, which is what made deleting it a non-event rather than a cutover.
  parentRefs:
    - name: ago-chat-gateway
      sectionName: https-chat-api
  hostnames:
    - chat-api.reserve-me.ru
  rules:
    # Same three prefixes as overlays/local/gateway.yaml - unchanged by the public/TLS shift, only the
    # hostname and parent listener differ.
    - matches:
        - path:
            type: PathPrefix
            value: /healthz
      backendRefs:
        - name: ago-chat-api
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: ago-chat-api
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /hubs
      backendRefs:
        - name: ago-chat-api
          port: 80
    # `adr/0092`: the one thing on this host that is not the API. The widget bundle a tenant's own
    # page loads - `<script src="https://chat-api.reserve-me.ru/widget/widget.js">`.
    #
    # **Why on the API's host rather than a `widget.`/`cdn.` one of its own.** The widget bakes its
    # API origin in at build time, and that single property is what forced `adr/0091`'s rename into a
    # three-step migration with a cache-expiry wait in the middle: an already-served bundle cannot be
    # re-pointed by anything we deploy. Serving the canonical copy from the API's own origin is the
    # way out - `config.ts` already reads `data-api` with a build-time fallback and already captures
    # `script.src`, so the widget can eventually derive its API base from where it was loaded. A
    # separate asset hostname would foreclose that permanently and make the next rename cost what
    # this one did.
    #
    # Two arguments for a separate host were checked and dropped rather than repeated: the per-IP
    # `RateLimitPolicy` below targets the **Gateway**, so it already applies to every hostname
    # including any new one; and cache headers come from the image's own nginx.conf, not from the
    # host it is routed at.
    #
    # `ReplacePrefixMatch` strips `/widget` so the image serves its files from its own root - which
    # keeps it identical to the demo images' layout, and is what lets `ui/moduleLoader.ts` resolve
    # `widget-module-booking.js` as a sibling of `widget.js` (`adr/0058`) without knowing this
    # prefix exists.
    #
    # The API pods never see these requests. Matched on `/widget` rather than `/widget/` so the bare
    # path resolves too.
    - matches:
        - path:
            type: PathPrefix
            value: /widget
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: ago-widget-assets
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ago-chat-auth
spec:
  parentRefs:
    - name: ago-chat-gateway
      sectionName: https-auth
  hostnames:
    - auth.reserve-me.ru
  rules:
    # The whole app, not a path prefix - Keycloak owns this entire hostname (its login UI, its
    # admin console, its OIDC discovery/JWKS/token endpoints all live under one root here).
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: keycloak
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ago-console
spec:
  # `adr/0091` step 3: the bare product name now belongs to the human-facing console, which is the
  # whole point of that decision - `chat.reserve-me.ru` is the address a customer would guess, and
  # `console.` was a role word with no product in it.
  #
  # **`console.` stays for one more release on purpose.** A bookmark, a link somebody was sent, and
  # the operator-login button on the landing page all still name it; deleting the two at once would
  # make every one of them fail on the same day. Removing it - here, from the certificate's SAN list,
  # from the Keycloak client's redirect URIs, and from DNS - is the release after this one.
  parentRefs:
    - name: ago-chat-gateway
      sectionName: https-chat
  hostnames:
    - chat.reserve-me.ru
  rules:
    # ago-console Service: console-static.yaml (8-02), port 80 matching every other Service in
    # this overlay's own convention (base/*.yaml).
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ago-console
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ago-demo-shop1
spec:
  parentRefs:
    - name: ago-chat-gateway
      sectionName: https-demo-shop1
  hostnames:
    - demo-shop1.reserve-me.ru
  rules:
    # ago-demo-shop1 Service: demo-shop1-static.yaml (8-02) - the whole app, not a path prefix,
    # same shape as ago-console above (a single static site, no API path split needed here).
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ago-demo-shop1
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ago-demo-shop2
spec:
  parentRefs:
    - name: ago-chat-gateway
      sectionName: https-demo-shop2
  hostnames:
    - demo-shop2.reserve-me.ru
  rules:
    # ago-demo-shop2 Service: demo-shop2-static.yaml - same shape as ago-demo-shop1 above.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ago-demo-shop2
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: landing
spec:
  parentRefs:
    - name: ago-chat-gateway
      sectionName: https-landing
  hostnames:
    - reserve-me.ru
  rules:
    # ago-landing Service: landing-static.yaml - the whole app, not a path prefix, same shape as
    # every other single-static-site route in this overlay.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ago-landing
          port: 80
---
# `20-20`: AGO Calendar's own REST API. No `/hubs` prefix - this host maps no SignalR hub at all
# (`Ago.Calendar.Api/Program.cs` has no `MapHub` call; checked against the source, not assumed). No
# `/healthz` prefix either, matching calendar-api.yaml's own header: this host serves no such route
# today, so a route naming it would 404 on every request rather than proxy anything real.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ago-calendar-api
spec:
  parentRefs:
    - name: ago-chat-gateway
      sectionName: https-calendar
  hostnames:
    - calendar-api.reserve-me.ru
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ago-calendar-api
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ago-calendar-console
spec:
  parentRefs:
    - name: ago-chat-gateway
      sectionName: https-calendar-console
  hostnames:
    - calendar.reserve-me.ru
  rules:
    # ago-calendar-console Service: calendar-console-static.yaml - the whole app, not a path prefix,
    # same shape as ago-console's own route above.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ago-calendar-console
          port: 80
---
apiVersion: gateway.nginx.org/v1alpha1
kind: UpstreamSettingsPolicy
metadata:
  name: ago-chat-api-least-conn
spec:
  targetRefs:
    - group: core
      kind: Service
      name: ago-chat-api
  # Same reasoning as overlays/local/gateway.yaml (edge.md): least_conn, not round-robin, for
  # long-lived WebSocket connections.
  loadBalancingMethod: least_conn
---
# edge.md's own "What the edge is responsible for" names both of these ("coarse, cluster-protecting
# rate limits and connection caps per IP", "request size ceilings") as the edge's job - true as
# design intent since that doc was written, but never actually implemented until now. Found live:
# with the demo publicly reachable, a raw request flood or an oversized body never even reaches an
# application-level limiter (those only fire on specific operations - message-send, attachment-create,
# visitor-session-create - not on every request), so nothing between the internet and the cluster was
# actually enforcing either claim. Demo-overlay-only, not base/ or overlays/local - a local
# Docker-Desktop cluster has no real attacker on the other side of it to defend against.
apiVersion: gateway.nginx.org/v1alpha1
kind: ClientSettingsPolicy
metadata:
  name: ago-chat-gateway-body-size
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: ago-chat-gateway
  body:
    # Every real JSON body this API accepts is small (a message, a visitor-session request, a
    # presign request) - attachment *bytes* never flow through here at all (adr/0008, presigned
    # direct-to-storage uploads). 1Mi is generous headroom for the former and irrelevant to the
    # latter; anything larger than that hitting this Gateway is not a request this API was ever
    # going to accept anyway.
    maxSize: "1m"
---
apiVersion: gateway.nginx.org/v1alpha1
kind: RateLimitPolicy
metadata:
  name: ago-chat-gateway-per-ip
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ago-chat-gateway
  rateLimit:
    local:
      rules:
        # A coarse, per-IP backstop against a raw request flood - deliberately looser than any
        # single application-level limiter (MessageSendRateLimitOptions etc., caching.md), since
        # this fires on *every* request to *every* route (including the static demo pages and
        # Grafana), not just the specific operations those limiters guard. $binary_remote_addr,
        # not $remote_addr - the binary form keys nginx's shared-memory zone by fewer bytes per
        # entry, the documented reason to prefer it for this exact use.
        - key: "$binary_remote_addr"
          rate: "30r/s"
          burst: 60
          zoneSize: "10m"
---
# `17-02`: an access-log format that does not contain the query string. Identical to
# overlays/local/gateway.yaml's own NginxProxy, which carries the full reasoning - in short, with no
# access-log configuration anywhere in this repository NGINX's compiled-in `combined` default
# applied, `combined` logs `$request` (the full original request line, query string included), and a
# browser SignalR client has nowhere but the query string to put its bearer token on a WebSocket
# handshake (realtime.md). Every hub connect therefore wrote a live token to this node's disk.
# Verified live on the local cluster before and after; `$uri` drops the query string and keeps the
# rest of `combined`'s shape.
#
# Unlike the two policies above, this one is *not* demo-only reasoning - it is in overlays/local too,
# because the point is not to defend against an attacker but not to write a secret down.
#
# One residual this does not close, and cannot: nginx's **error** log prints `request: "..."` and the
# full upstream URI with the query string intact, and that string is not configurable. So a *failing*
# hub connect (a 502 during a rolling deploy, an upstream timeout) still puts the token on disk.
# ago-root's `backlog/17-02` records it with the measurement; closing it means moving the token out
# of the query string, which both `5-14` and `17-02` scope out on purpose.
apiVersion: gateway.nginx.org/v1alpha2
kind: NginxProxy
metadata:
  name: ago-chat-gateway-proxy
spec:
  logging:
    accessLog:
      format: '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_referer" "$http_user_agent"'
