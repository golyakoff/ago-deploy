# adr/0026, adr/0091, adr/0093; `26-267`: the public edge, on agochat.ru.
#
# The stack migrated from reserve-me.ru to agochat.ru (ago-business
# docs/infra/domain-migration-agochat.md). Phase 4 (this file) removed the reserve-me.ru listeners and
# routes; only agochat.ru remains. The reserve-me.ru HTTPRoute objects are deleted explicitly on the
# node (kubectl apply does not prune), and the reserve-me.ru A-records are the author's own registrar
# step. A Gateway API wildcard hostname matches subdomains only, never the bare apex, so the apex
# (ago-landing) keeps its own listener pair. Same NGINX Gateway Fabric component as overlays/local/
# (adr/0014) - only the listeners, hostnames and TLS wiring differ.
#
# grafana is not served here (removed 2026-08-25; reachable over an SSH tunnel - runbooks/public-deploy.md).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ago-chat-gateway
spec:
  gatewayClassName: nginx
  infrastructure:
    parametersRef:
      group: gateway.nginx.org
      kind: NginxProxy
      name: ago-chat-gateway-proxy
  listeners:
    # Plain HTTP: cert-manager's own gatewayHTTPRoute ACME solver (adr/0026, tls.yaml) answers
    # Let's Encrypt's HTTP-01 challenge through a temporary HTTPRoute under this Gateway, and needs a
    # working :80 listener per challenged name. Everything else on :80 redirects to HTTPS
    # (http-to-https-redirect below). The wildcard covers every agochat.ru subdomain; the apex gets its
    # own :80 listener (a wildcard never matches the bare apex).
    - name: http-agochat
      port: 80
      protocol: HTTP
      hostname: "*.agochat.ru"
    - name: http-agochat-apex
      port: 80
      protocol: HTTP
      hostname: agochat.ru
    # One wildcard HTTPS listener terminates every agochat.ru subdomain with the shared ago-public-tls
    # cert (which carries each exact SAN - tls.yaml); the apex gets its own.
    - name: https-agochat
      port: 443
      protocol: HTTPS
      hostname: "*.agochat.ru"
      tls:
        mode: Terminate
        certificateRefs:
          - name: ago-public-tls
    - name: https-agochat-apex
      port: 443
      protocol: HTTPS
      hostname: agochat.ru
      tls:
        mode: Terminate
        certificateRefs:
          - name: ago-public-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect-agochat
spec:
  parentRefs:
    - name: ago-chat-gateway
      sectionName: http-agochat
    - name: ago-chat-gateway
      sectionName: http-agochat-apex
  hostnames:
    - "*.agochat.ru"
    - agochat.ru
  rules:
    # cert-manager's own ACME HTTP-01 solver attaches its own temporary HTTPRoute to the :80 listeners
    # with an exact hostname and an exact /.well-known/acme-challenge/<token> path; Gateway API's
    # route-precedence rules (exact beats wildcard) mean that route always wins for its own request.
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ago-chat-api-agochat
spec:
  parentRefs:
    - name: ago-chat-gateway
      sectionName: https-agochat
  hostnames:
    - chat-api.agochat.ru
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /healthz
      backendRefs:
        - name: ago-chat-api
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: ago-chat-api
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /hubs
      backendRefs:
        - name: ago-chat-api
          port: 80
    # adr/0092: the widget bundle a tenant's page loads - <script src="https://chat-api.agochat.ru/widget/widget.js">.
    # ReplacePrefixMatch strips /widget so the image serves from its own root; matched on /widget (not
    # /widget/) so the bare path resolves too.
    - matches:
        - path:
            type: PathPrefix
            value: /widget
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: ago-widget-assets
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ago-chat-auth-agochat
spec:
  parentRefs:
    - name: ago-chat-gateway
      sectionName: https-agochat
  hostnames:
    - auth.agochat.ru
  rules:
    # The whole app, not a path prefix - Keycloak owns this entire hostname.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: keycloak
          port: 8080
---
