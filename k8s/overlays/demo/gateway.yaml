# 20-20/22-18: AGO Calendar's own REST API. No /hubs (no SignalR hub here). The public surface is
# enumerated rather than PathPrefix / so the chat-to-module channel (/api/v1/module-tasks,
# /api/v1/module-registrations, authenticated by a deployment-wide secret) is never published; those
# calls stay inside the pod network. A route added to this host is not served until it is named here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ago-calendar-api-agochat
spec:
  parentRefs:
    - name: ago-chat-gateway
      sectionName: https-agochat
  hostnames:
    - calendar-api.agochat.ru
  rules:
    - matches:
        - path:
            type: Exact
            value: /
        - path:
            type: PathPrefix
            value: /healthz
        - path:
            type: PathPrefix
            value: /api/v1/console
        - path:
            type: PathPrefix
            value: /api/v1/calendars
        - path:
            type: PathPrefix
            value: /api/v1/embed
        - path:
            type: PathPrefix
            value: /api/v1/me
      backendRefs:
        - name: ago-calendar-api
          port: 80
---
# 25-103: MinIO's S3 API. backendRef names port 9000 (the S3 API) explicitly, by number, so the admin
# console (:9001) stays unreachable through this Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ago-minio-files-agochat
spec:
  parentRefs:
    - name: ago-chat-gateway
      sectionName: https-agochat
  hostnames:
    - files.agochat.ru
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: minio
          port: 9000
---
apiVersion: gateway.nginx.org/v1alpha1
kind: UpstreamSettingsPolicy
metadata:
  name: ago-chat-api-least-conn
spec:
  targetRefs:
    - group: core
      kind: Service
      name: ago-chat-api
  # Same reasoning as overlays/local/gateway.yaml (edge.md): least_conn, not round-robin, for
  # long-lived WebSocket connections.
  loadBalancingMethod: least_conn
---
# edge.md's own "What the edge is responsible for" names both of these ("coarse, cluster-protecting
# rate limits and connection caps per IP", "request size ceilings") as the edge's job - true as
# design intent since that doc was written, but never actually implemented until now. Found live:
# with the demo publicly reachable, a raw request flood or an oversized body never even reaches an
# application-level limiter (those only fire on specific operations - message-send, attachment-create,
# visitor-session-create - not on every request), so nothing between the internet and the cluster was
# actually enforcing either claim. Demo-overlay-only, not base/ or overlays/local - a local
# Docker-Desktop cluster has no real attacker on the other side of it to defend against.
apiVersion: gateway.nginx.org/v1alpha1
kind: ClientSettingsPolicy
metadata:
  name: ago-chat-gateway-body-size
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: ago-chat-gateway
  body:
    # `25-103`: THIS WAS "1m", CHANGED HERE, NOT JUST FLAGGED. This paragraph used to read: "Every
    # real JSON body this API accepts is small (a message, a visitor-session request, a presign
    # request) - attachment *bytes* never flow through here at all (adr/0008, presigned
    # direct-to-storage uploads). 1Mi is generous headroom for the former and irrelevant to the
    # latter; anything larger than that hitting this Gateway is not a request this API was ever going
    # to accept anyway." That stopped being true the moment this same item put MinIO's S3 API behind
    # the identical `ago-chat-gateway` object this policy's own `targetRef` names (the whole Gateway,
    # not a listener) - a presigned attachment PUT now crosses this Gateway too, and `docs/
    # architecture/file-storage.md`'s "The gateway's own body-size ceiling does not contradict this"
    # paragraph, which rested on the same "never through this gateway at all" claim, needed the
    # identical correction (fixed there in this same change).
    #
    # `AttachmentOptions.MaxSizeBytes` is 5 MiB (`23-81`, confirmed directly in
    # `ago-chat/src/Ago.Chat.Application/UseCases/CreateAttachment/AttachmentOptions.cs` rather than
    # trusted from an older comment - `public long MaxSizeBytes { get; set; } = 5 * 1024 * 1024;`).
    # `10m` is double that: simple, defensible headroom over the real application ceiling (SigV4
    # signs the exact declared Content-Length into a presigned PUT, so nothing legitimate ever
    # actually sends more than 5 MiB through this path regardless of what the edge allows) rather than
    # a value trimmed tight to today's number and needing a second edit the next time
    # `MaxSizeBytes` moves.
    #
    # Global, not scoped to the new `https-files` listener alone: NGINX Gateway Fabric's
    # `ClientSettingsPolicy` CRD has no established per-listener (`sectionName`) precedent anywhere in
    # this repository's own manifests, and guessing at an unverified capability on live public
    # infrastructure is worse than a straightforward whole-Gateway raise. Every *other* body this
    # Gateway accepts (a message, a visitor-session request, a presign request) is still small - a
    # 10Mi ceiling does not weaken their protection, it only also covers what MinIO now legitimately
    # needs through this same edge.
    maxSize: "10m"
---
apiVersion: gateway.nginx.org/v1alpha1
kind: RateLimitPolicy
metadata:
  name: ago-chat-gateway-per-ip
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ago-chat-gateway
  rateLimit:
    local:
      rules:
        # A coarse, per-IP backstop against a raw request flood - deliberately looser than any
        # single application-level limiter (MessageSendRateLimitOptions etc., caching.md), since
        # this fires on *every* request to *every* route (including the static demo pages and
        # Grafana), not just the specific operations those limiters guard. $binary_remote_addr,
        # not $remote_addr - the binary form keys nginx's shared-memory zone by fewer bytes per
        # entry, the documented reason to prefer it for this exact use.
        - key: "$binary_remote_addr"
          rate: "30r/s"
          burst: 60
          zoneSize: "10m"
---
# `17-02`: an access-log format that does not contain the query string. Identical to
# overlays/local/gateway.yaml's own NginxProxy, which carries the full reasoning - in short, with no
# access-log configuration anywhere in this repository NGINX's compiled-in `combined` default
# applied, `combined` logs `$request` (the full original request line, query string included), and a
# browser SignalR client has nowhere but the query string to put its bearer token on a WebSocket
# handshake (realtime.md). Every hub connect therefore wrote a live token to this node's disk.
# Verified live on the local cluster before and after; `$uri` drops the query string and keeps the
# rest of `combined`'s shape.
#
# Unlike the two policies above, this one is *not* demo-only reasoning - it is in overlays/local too,
# because the point is not to defend against an attacker but not to write a secret down.
#
# One residual this does not close, and cannot: nginx's **error** log prints `request: "..."` and the
# full upstream URI with the query string intact, and that string is not configurable. So a *failing*
# hub connect (a 502 during a rolling deploy, an upstream timeout) still puts the token on disk.
# ago-root's `backlog/17-02` records it with the measurement; closing it means moving the token out
# of the query string, which both `5-14` and `17-02` scope out on purpose.
apiVersion: gateway.nginx.org/v1alpha2
kind: NginxProxy
metadata:
  name: ago-chat-gateway-proxy
spec:
  logging:
    accessLog:
      format: '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_referer" "$http_user_agent"'
