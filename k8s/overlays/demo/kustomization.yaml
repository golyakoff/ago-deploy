  # control automatically at the first module (booking) message when the visitor never clicked its own
  # "Представиться..." link - the live gap a real tenant's operator reported, reproduced and confirmed
  # fixed against this exact commit before pinning it here.
  # `25-110`: bumped to the commit that makes the widget react live to a pushed attachment-upload
  # grant/revoke - the "скрепка" (attach button) now appears the moment an operator toggles the
  # per-conversation grant, instead of only after the visitor reloads. Deployed and smoke-tested live
  # before this pin (43/43, `654e9c0` reported by all three bundles alike).
  # `25-120`: bumped to the commit replacing the reserved emoji place with a real 40-glyph picker
  # (`23-61`'s own deferred scope). `25-119`: same commit range also carries the widget's own
  # delivered-ack (`VisitorHub.AcknowledgeDeliveredAsync`) - both landed and deployed together.
  # Smoke-tested live before this pin (42/42, `89c7587` reported by all three bundles alike).
  # `25-126`/`25-127`/`25-128`/`25-130`: a batch of live-reported polish fixes - the booking chip
