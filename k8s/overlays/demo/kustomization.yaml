apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ago-chat

resources:
  - ../../base
  - gateway.yaml
  - tls.yaml
  # 8-02: static-file-serving Deployments/Services for the console bundle, the widget's own public
  # demo pages, and the public marketing page at the apex - demo-overlay-only, see each file's own
  # header comment for why none of these belong in ../../base.
  - console-static.yaml
  - demo-shop1-static.yaml
  - demo-shop2-static.yaml
  - landing-static.yaml
  # `15-03`: alerting. Demo-overlay-only, deliberately - see alertmanager.yaml's own header for why
  # this is not in ../../base alongside prometheus.yaml and grafana.yaml, and for why Alertmanager
  # was chosen over Grafana's built-in alerting. Not routed through gateway.yaml and never will be:
  # it holds no data worth reaching from outside, and the same reasoning that removed Grafana's
  # public route applies.
  - alertmanager.yaml
  # `17-05`: the first NetworkPolicy resources in this repository. Demo overlay only - see that
  # file's own header for why they are not in ../../base (the local cluster's CNI has never been
  # shown to enforce policy, and unenforced policy reads as protection).
  - network-policies.yaml

# Same shape as overlays/local/kustomization.yaml's own secretGenerator - one Secret, real values
# this time (adr/0026, .env.example's own header comment: these are NOT the local throwaway
# passwords, generate fresh ones before copying .env.example to .env).
secretGenerator:
  - name: infra-credentials
    envs: [.env]

# `15-03`. NOTE THAT NOTHING WAS ADDED TO .env OR .env.example BY THIS ITEM, and the absence is the
# point rather than an omission: the notification channel is the node's own Postfix over the cluster
# bridge, which takes no SMTP AUTH and no TLS (`adr/0040`'s amendment, and .env.example's own
# KEYCLOAK_SMTP_* block records the identical hop for Keycloak). There is no credential to keep out
# of git. The one value that genuinely must not be committed - the human mailbox alerts are forwarded
# to - is not a deployment setting at all: it lives in the node's /etc/aliases, which is neither a
# repository nor a Secret.
configMapGenerator:
  # behavior: merge, not a new generator. The base already declares `prometheus-config` with
  # prometheus.yml in it; merging adds one more key to that same ConfigMap so the rules land in
  # /etc/prometheus next to the config, where base/prometheus-scrape-config.yml's
  # `rule_files: [/etc/prometheus/*.rules.yml]` glob finds them. No second volume, no patch to the
  # Prometheus Deployment, and the ConfigMap hash still changes when the rules change - which is what
  # makes `kubectl apply -k` actually roll the pod instead of leaving it on stale rules.
  - name: prometheus-config
    behavior: merge
    files:
      - demo.rules.yml=prometheus-alert-rules.yml
  - name: alertmanager-config
    files:
      - alertmanager.yml=alertmanager-config.yml

# `15-06`/`adr/0047`: the three host images come from GHCR under an immutable, identifying tag - the
# full commit SHA - instead of the mutable `:local` tag adr/0026 imported straight into containerd.
#
# **This block is the record of what this environment is meant to be running.** `deploy.sh <sha>`
# changes the live Deployments with `kubectl set image` and does not edit this file, so the two drift
# on purpose and in one direction only: a `kubectl apply -k` of this overlay resets the cluster to
# the tag written here. That is a trap if it is forgotten and a feature if it is not, so the rule is
# explicit - after a deploy that is meant to stick, update these three tags and commit. deploy.sh
# prints the exact lines to change, and smoke.sh compares what is running against what is here.
#
# No `imagePullPolicy` patch any more (there were three, one per host, all removed here). The
# default for a non-`:latest` tag is IfNotPresent, which is exactly right for an immutable SHA tag:
# present in containerd, it is used without a network call - so a node that built its own image, or
# imported one, behaves as it always did - and absent, it is pulled from GHCR. `Never` cannot do the
# second half, and the second half is what makes a rebuilt cluster (15-02) able to start at all.
images:
  - name: ago-chat-api
    newName: ghcr.io/golyakoff/ago-chat-api
    newTag: f3ecc0d87bb20d3de467a1aeeb5c4d636bc48a65
  - name: ago-chat-worker
    newName: ghcr.io/golyakoff/ago-chat-worker
    newTag: f3ecc0d87bb20d3de467a1aeeb5c4d636bc48a65
  - name: ago-chat-webhooks
    newName: ghcr.io/golyakoff/ago-chat-webhooks
    newTag: f3ecc0d87bb20d3de467a1aeeb5c4d636bc48a65
  # `15-07`/`adr/0051`: the four static bundles, which `15-06` could not reach - and the one it did
  # not reach is the one the 2026-08-25 incident happened to. Their four `imagePullPolicy: Never`
  # patches are gone from *-static.yaml for the same reason the three above went.
  #
  # These four do NOT share a tag with each other or with the hosts, and that is not an oversight:
  # they are built from three repositories that move independently, so one SHA cannot name more than
  # the images out of one of them. `deploy.sh <frontend> <sha>` moves one at a time for the same
  # reason. ago-demo-shop1 and ago-demo-shop2 do share a tag, because they really are one commit of
  # ago-widget packaged twice - the difference between them is in the name, never in the tag.
  #
  # **These four tags were built on the node and imported into containerd, not pulled from GHCR** -
  # they name commits from before each repository's publish job existed, which is the same position
  # 15-06 was in on the day it shipped (adr/0047's "What was actually performed"). `IfNotPresent`
  # finds them locally, so `apply -k` is safe today; the first `main` build after this item merges
  # publishes real GHCR images, and these four values should be updated to those commits then.
  - name: ago-console
    newName: ghcr.io/golyakoff/ago-console
    newTag: 6ed0411ab32166c8d0c41eff75dee87abe61ca28
  - name: ago-demo-shop1
    newName: ghcr.io/golyakoff/ago-demo-shop1
    newTag: 1edbcd878edef26515bda51809092f03bd95de66
  - name: ago-demo-shop2
    newName: ghcr.io/golyakoff/ago-demo-shop2
    newTag: 1edbcd878edef26515bda51809092f03bd95de66
  - name: ago-landing
    newName: ghcr.io/golyakoff/ago-landing
    newTag: e6ad7d5749b7eabd13594752054cc4935a6833ea

patches:
  # `15-06`: the three `imagePullPolicy: Never` patches that used to open this list are gone - see the
  # `images:` block above for why the default is now correct. What adr/0026 reasoned about here (a node
  # that builds its own images and imports them into containerd) is still true; what changed is that an
  # immutable tag makes `IfNotPresent` behave the same way locally *and* able to pull on a rebuilt node.



  - target:
      kind: Deployment
      name: keycloak
    patch: |
      # No imagePullPolicy patch here, deliberately - and this stays true now that the three
      # ago-chat-* patches are gone (`15-06`):
      # keycloak runs the real upstream `quay.io/keycloak/keycloak` image (base/keycloak.yaml), never
      # built locally, so it needs its own default pull policy to actually reach the registry. Copying
      # the Never patch here by pattern-matching the ago-chat-* entries above was a real bug, caught
      # live: it produced ErrImageNeverPull on the real cluster (2026-08-24), since nothing had ever
      # imported a "keycloak:local" tag into this node's containerd - there is no such tag, it was
      # never meant to exist.
      # adr/0026: base/keycloak.yaml's args (start-dev --import-realm --health-enabled=true) are
      # correct for a Keycloak that only ever sees requests addressed to localhost/the in-cluster
      # Service name. Publicly, NGINX Gateway Fabric terminates TLS in front of it and forwards plain
      # HTTP - without --hostname and --proxy-headers, Keycloak would build its own issuer/redirect
      # URLs from the internal http://keycloak:8080 request it actually receives, not
      # https://auth.reserve-me.ru, breaking both the Operator JWT iss-claim check (5-05) and the
      # console's own redirect (8-02). --http-enabled=true is required because Keycloak's own
      # production-mode default (start-dev inherits some of this) refuses plain HTTP once a public
      # --hostname is set, unless told explicitly that TLS is handled upstream. Kept on `start-dev`
      # rather than switching to full production `start` mode - adr/0026's own "Consequences" section
      # names this as a deliberate, stated gap (a demo IdP for one seeded operator), not a silent
      # shortcut. `15-01`/`adr/0036` re-opened that choice on purpose, since "start-dev keeps its data
      # in H2" was one of the reasons the gap mattered, and kept `start-dev` anyway with the reasoning
      # written down there - the remaining blocker is that `sslRequired: "none"` cannot be raised until
      # proxy-header trust is verified end to end through the Gateway, which needs the real node.
      #
      # This patch replaces `args` only. base/keycloak.yaml's `env` (KC_DB*, `15-01`) and its
      # `initContainers` (the one that creates Keycloak's own database) are inherited unchanged, so the
      # demo deployment gets a persistent user store from the same base manifest the local overlay uses
      # - which is the point: this class of bug survived because local and demo agreed on being wrong.
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - "start-dev"
          - "--import-realm"
          - "--health-enabled=true"
          - "--hostname=https://auth.reserve-me.ru"
          - "--hostname-strict=false"
          - "--proxy-headers=xforwarded"
          - "--http-enabled=true"
