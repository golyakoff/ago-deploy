  # `25-133`/`25-136`: stop duplicating a step's plain text under its own rich buttons, and gate a
  # module step's own controls on the contact-capture form - no migration.
  # `25-149`/`8-13`: the Jivo-style channel-switcher card above the composer, and the minted-tenant
