patches:
  # `8-07`/ago-root `adr/0058`: this is the one deployment that wants the demo-credential endpoint, so
  # this is where it is turned on.
  #
  # **`8-09` turned it on** - the one-word diff this block was shaped to make possible. The condition
  # it was waiting for is met: `ago-widget`'s two `public-demo*/index.html` pages now read `?site=`
  # (falling back to their own baked-in key, so every existing link is unaffected) and both render a
  # "Get your own tenant" button that calls this endpoint. A minted viewer's console now has a widget
  # pointing at it, which is what makes the feature better than the shared account rather than worse.
  #
  # **Turning this on publishes an unauthenticated, tenant-creating endpoint on the public internet.**
  # That is intended, and `8-07` built two guards for it that are worth naming here because this is the
  # line that arms them: a per-IP rate limit (3, refilling at ~3/hour) and a total cap on live demo
  # tenants (50), counted from the database inside the request rather than cached. Setting this back to
  # "false" is the whole of the rollback - the endpoint refuses immediately, and `DemoTenantExpiryJob`
  # keeps deleting whatever was already minted.
  #
  # The visitor origin is the public demo shop the minted tenant's `visitorUrl` points a viewer at, and
  # the minted site is created with exactly this origin allowed, so `5-01`'s layer 2 lets its widget
  # connect.
  #
  # A strategic-merge patch, not a JSON-patch by index: kustomize merges `env` by the `name` key, so
  # this changes exactly these two variables and leaves the other twenty alone. An index would have
  # silently overwritten whichever variable happened to sit at that position - which it did, on the
  # first attempt here, where `/env/0` is the database connection string.
  - target:
      kind: Deployment
      name: ago-chat-api
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ago-chat-api
      spec:
        template:
          spec:
            containers:
              - name: api
                env:
                  - name: DemoTenant__Enabled
                    value: "true"
                  - name: DemoTenant__VisitorOrigin
                    value: "https://demo-shop1.reserve-me.ru"
                  # `23-45`: the two seeded shops whose operator password is printed on the demo
                  # pages, and the only accounts the console's standing public-demo warning is shown
                  # to. Everybody else - a real tenant, a minted demo tenant, the platform owner - is
                  # told nothing, because for them the warning's own sentences are false.
                  #
                  # **The API refuses to start without this while DemoTenant__Enabled is true.**
                  # That is deliberate: the band now appears only for the sites named here, so an
                  # empty list would silently un-warn the one account whose password anybody can read
                  # off a web page - a missing sentence on a console that otherwise works perfectly.
                  # A crash at boot is the loud version of that mistake.
                  #
                  # Two entries, indexed - the .NET configuration binder's array shape. They are
                  # public keys, not secrets: `demo_site` is printed on the demo page beside the
                  # password, and smoke.sh has used it as its own default PUBLIC_KEY for months.
                  - name: DemoTenant__PublishedCredentialSitePublicKeys__0
                    value: "demo_site"
                  - name: DemoTenant__PublishedCredentialSitePublicKeys__1
                    value: "demo_site2"
  # The Worker needs the credential to expire tenants, and the flag to require it - but it mints
  # nothing, so it needs no visitor origin.
  - target:
      kind: Deployment
      name: ago-chat-worker
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ago-chat-worker
      spec:
        template:
          spec:
            containers:
              - name: worker
                env:
                  - name: DemoTenant__Enabled
                    value: "true"
  # `14-07`/ago-root `adr/0070`: the Telegram outbound relay. Originally an init-container sidecar in
  # this Deployment's own pod, reachable only at `127.0.0.1` - that patch's own comment already named
  # the gap this item (`25-116`) closes: `Ago.Chat.Api`'s `getMe` token-validation check (the console's
  # own "Подключить" button) got no proxy at all and was left exposed to the same direct-connection
  # failure rate `adr/0070` measured (found live 2026-09-16, re-measured worse than the ADR's own
  # 47%/53% split: 10/10 direct connections to `api.telegram.org` timed out from this VPS, zero TCP
  # handshakes, DNS resolving fine, a control host answering in 150ms). That comment's own named
  # remedy - "a Service + NetworkPolicy pair" - is `telegram-relay.yaml` (this overlay) plus
  # `network-policies.yaml`'s own `telegram-relay-ingress` rule: one shared relay both hosts point at,
  # rather than a second copy of the sidecar (which would open a second, independent VLESS connection
  # to the author's own personal relay for no reason - `adr/0070`'s own named, accepted gap already
  # limits that relay to one instance's worth of trust).
  #
  # The relay's own container image, digest, security posture and resource sizing are unchanged by
  # this move - see `telegram-relay.yaml`'s own header for what carried over and why. What changed:
  # `TELEGRAM_RELAY_XRAY_CONFIG`'s own `listen` field moved from `127.0.0.1` to `0.0.0.0` (a loopback
  # bind can only ever be reached from inside the same pod; a Service needs the Pod IP to be reachable)
  # - updated directly in the node's own `.env.telegram-relay` file, never committed, the same "real
  # values never enter this repository" rule every other secret here already follows.
  - target:
      kind: Deployment
      name: ago-chat-worker
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ago-chat-worker
      spec:
        template:
          spec:
            containers:
              - name: worker
                env:
                  - name: Channels__Telegram__Proxy__Socks5Address
                    value: "telegram-relay:1080"
  # `25-116`: `Ago.Chat.Api`'s own half of the fix above - the exact same relay address `worker` gets,
  # so its `getMe` token-validation call (`RegisterChannelCredentialHandler`) stops connecting to
  # Telegram directly.
  - target:
      kind: Deployment
      name: ago-chat-api
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ago-chat-api
      spec:
        template:
          spec:
            containers:
              - name: api
                env:
                  - name: Channels__Telegram__Proxy__Socks5Address
                    value: "telegram-relay:1080"
  # `15-06`: the three `imagePullPolicy: Never` patches that used to open this list are gone - see the
  # `images:` block above for why the default is now correct. What adr/0026 reasoned about here (a node
  # that builds its own images and imports them into containerd) is still true; what changed is that an
  # immutable tag makes `IfNotPresent` behave the same way locally *and* able to pull on a rebuilt node.



  - target:
      kind: Deployment
      name: keycloak
    patch: |
      # No imagePullPolicy patch here, deliberately - and this stays true now that the three
      # ago-chat-* patches are gone (`15-06`):
      # keycloak runs the real upstream `quay.io/keycloak/keycloak` image (base/keycloak.yaml), never
      # built locally, so it needs its own default pull policy to actually reach the registry. Copying
      # the Never patch here by pattern-matching the ago-chat-* entries above was a real bug, caught
      # live: it produced ErrImageNeverPull on the real cluster (2026-08-24), since nothing had ever
      # imported a "keycloak:local" tag into this node's containerd - there is no such tag, it was
      # never meant to exist.
      # adr/0026: base/keycloak.yaml's args (start-dev --import-realm --health-enabled=true) are
      # correct for a Keycloak that only ever sees requests addressed to localhost/the in-cluster
      # Service name. Publicly, NGINX Gateway Fabric terminates TLS in front of it and forwards plain
      # HTTP - without --hostname and --proxy-headers, Keycloak would build its own issuer/redirect
      # URLs from the internal http://keycloak:8080 request it actually receives, not
      # https://auth.reserve-me.ru, breaking both the Operator JWT iss-claim check (5-05) and the
      # console's own redirect (8-02). --http-enabled=true is required because Keycloak's own
      # production-mode default (start-dev inherits some of this) refuses plain HTTP once a public
      # --hostname is set, unless told explicitly that TLS is handled upstream. Kept on `start-dev`
      # rather than switching to full production `start` mode - adr/0026's own "Consequences" section
      # names this as a deliberate, stated gap (a demo IdP for one seeded operator), not a silent
      # shortcut. `15-01`/`adr/0036` re-opened that choice on purpose, since "start-dev keeps its data
      # in H2" was one of the reasons the gap mattered, and kept `start-dev` anyway with the reasoning
      # written down there - the remaining blocker is that `sslRequired: "none"` cannot be raised until
      # proxy-header trust is verified end to end through the Gateway, which needs the real node.
      #
      # This patch replaces `args` only. base/keycloak.yaml's `env` (KC_DB*, `15-01`) and its
      # `initContainers` (the one that creates Keycloak's own database) are inherited unchanged, so the
      # demo deployment gets a persistent user store from the same base manifest the local overlay uses
      # - which is the point: this class of bug survived because local and demo agreed on being wrong.
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - "start-dev"
          - "--import-realm"
          - "--health-enabled=true"
          - "--hostname=https://auth.reserve-me.ru"
          - "--hostname-strict=false"
          - "--proxy-headers=xforwarded"
          - "--http-enabled=true"

  # `22-24`/`adr/0137`: a second Kestrel endpoint on `ago-calendar-api`, not a replacement for the
  # first. `gateway.yaml`'s own HTTPRoutes still forward plain HTTP to this Service's port 80/8080,
  # exactly as `adr/0014`'s public edge already decided - that boundary is untouched by this change.
  # Port 8443 exists only for a caller inside this namespace that wants the encrypted listener, which
  # is the module channel and nothing else today (see this item's own report for how far it reaches).
  #
  # Both endpoints are named explicitly (`Kestrel:Endpoints:Http`/`:Https`) rather than leaving `Http`
  # to the base image's own `ASPNETCORE_HTTP_PORTS=8080` default: ASP.NET Core's own documented
  # endpoint-configuration precedence is that once any `Kestrel:Endpoints:*` key exists in
  # configuration, it is what Kestrel binds from - an implicit default is not a safe thing to keep
  # relying on once one explicit endpoint is added. Stating both is what keeps the startup/
  # readiness/liveness probes on 8080 working exactly as they do today, unchanged - no code change,
  # this is Kestrel's own configuration-driven endpoint binding, which `Ago.Calendar.Api/Program.cs`
  # never overrides (checked before writing this patch, not assumed).
  #
  # `internal-tls`: mounts `ago-calendar-api-internal-tls`, the leaf Certificate `internal-tls.yaml`
  # issues off this cluster's own root CA. A Secret volume, not a write this container performs -
  # `readOnlyRootFilesystem: true` above is unaffected.
  - target:
      kind: Deployment
      name: ago-calendar-api
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ago-calendar-api
      spec:
        template:
          spec:
            containers:
              - name: api
                ports:
                  - containerPort: 8443
                env:
                  - name: Kestrel__Endpoints__Http__Url
                    value: "http://+:8080"
                  - name: Kestrel__Endpoints__Https__Url
                    value: "https://+:8443"
                  - name: Kestrel__Endpoints__Https__Certificate__Path
                    value: "/etc/internal-tls/tls.crt"
                  - name: Kestrel__Endpoints__Https__Certificate__KeyPath
                    value: "/etc/internal-tls/tls.key"
                volumeMounts:
                  - name: internal-tls
                    mountPath: /etc/internal-tls
                    readOnly: true
            volumes:
              - name: internal-tls
                secret:
                  secretName: ago-calendar-api-internal-tls
  # The Service side of the same change - port 443 alongside the existing 80, never instead of it.
  # `base/calendar-api.yaml`'s own port just gained a `name` for exactly this: a Service with more
  # than one port must name every one of them.
  - target:
      kind: Service
      name: ago-calendar-api
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: ago-calendar-api
      spec:
        ports:
          - name: https
            port: 443
            targetPort: 8443
  # `23-93`/`adr/0164`: the module entry point's own scheme, switched from `base/api.yaml`'s plain
  # `http://ago-calendar-api` to the encrypted listener the three patches just above this one exist to
  # serve - mount-then-switch, in that order (this item's own text, and adr/0164's own Decision): the
  # CA has been trusted inside Ago.Chat.Api's own image since `22-24`, and the leg is proven end to end
  # in ago-chat's own ModuleRegistrationGatewayInternalTlsTests, so this switch is the last step, not
  # the first one taken as a shortcut.
  #
  # **Demo-only, deliberately not a change to `base/api.yaml` itself.** The local overlay
  # (`k8s/overlays/local/`) has no cert-manager, no `internal-tls.yaml`, and no 8443 listener on
  # `ago-calendar-api` at all - only this overlay does. Editing the value in `base/` would point the
  # local loop at a TLS port nothing there ever binds, turning every local module-registration call
  # into a connection failure with no listener on the other end, not the certificate-trust question
  # this item is actually about. `23-92`'s own comment on `base/api.yaml`'s line said the address
  # "lives in one place after 23-92" - true of the *variable*, not of every deployment needing the
  # identical *scheme*, and the two overlays do not: this is the same "environment-specific difference
  # over a shared base" split `DemoTenant__Enabled` above already uses for the identical reason.
  - target:
      kind: Deployment
      name: ago-chat-api
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ago-chat-api
      spec:
        template:
          spec:
            containers:
              - name: api
                env:
                  - name: ModuleEntryPoints__calendar
                    value: "https://ago-calendar-api:443"

  # `25-103`: `Storage__S3__ServiceUrl` (`base/api.yaml`, `worker.yaml`, `webhooks.yaml`) is the one
  # setting `Ago.Platform.Storage.S3` uses both for the server's own calls to MinIO and as the host a
  # presigned URL is signed against (AWS SigV4 signs the host into the request) - `http://minio:9000`
  # is the in-cluster Service DNS name, exactly what a browser outside the cluster cannot resolve.
  # `gateway.yaml`'s new `https-files` listener/`ago-minio-files` route (this same item) makes
  # `files.reserve-me.ru` a real public hostname for MinIO's `:9000` S3 API; these three patches point
  # the setting at it.
  #
  # A strategic-merge patch, not a change to `base/api.yaml`/`worker.yaml`/`webhooks.yaml` themselves
  # - `k8s/overlays/local/` has no Gateway route to MinIO at all (no cert-manager, no public
  # hostname), so editing the base value would break the local dev loop's own attachment upload the
  # moment it did. Same environment-specific-difference-over-a-shared-base split this file already
  # uses for `DemoTenant__Enabled` above and `ModuleEntryPoints__calendar` just above this comment -
  # and kustomize merges `env` by the `name` key the identical way, so each patch below changes
  # exactly this one variable and leaves the other ~20 on each Deployment (including `ago-chat-api`'s
  # own two other patches on this same target) alone. See the `DemoTenant__Enabled` patch's own
  # comment, above, for the JSON-patch-by-index bug a positional patch caused here the first time.
  #
  # Three hosts, three identical patches - `5-02`'s own remarks call `S3StorageOptions` shared config,
  # not per-host, and `grep -rn "Storage__S3__ServiceUrl" k8s/base/*.yaml` confirms exactly
  # `ago-chat-api`, `ago-chat-worker` and `ago-chat-webhooks` set it (three files, three Deployments).
  # `ago-chat-migrator` (`base/migrator.yaml`) deliberately does NOT get this patch - checked, not
  # assumed: its own header comment states it "reads no broker, no cache and no object store... does
  # not use ChatModule at all," and reading the manifest confirms no `Storage__S3__*` variable is set
  # there in the first place, so there is nothing for this patch to change.
  - target:
      kind: Deployment
      name: ago-chat-api
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ago-chat-api
      spec:
        template:
          spec:
            containers:
              - name: api
                env:
                  - name: Storage__S3__ServiceUrl
                    value: "https://files.reserve-me.ru"
  - target:
      kind: Deployment
      name: ago-chat-worker
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ago-chat-worker
      spec:
        template:
          spec:
            containers:
              - name: worker
                env:
                  - name: Storage__S3__ServiceUrl
                    value: "https://files.reserve-me.ru"
  - target:
      kind: Deployment
      name: ago-chat-webhooks
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ago-chat-webhooks
      spec:
        template:
          spec:
            containers:
              - name: webhooks
                env:
                  - name: Storage__S3__ServiceUrl
                    value: "https://files.reserve-me.ru"
  # `25-109`'s own live capacity-ramp investigation found base/postgres.yaml's own 512Mi limit is a
  # real, reproduced OOM at ~500 concurrently open conversations - not a guess, a crash caught live
  # (`load/reports/2026-09-15-local-capacity-ramp.md`, Run 1). This node runs the real deployment,
  # not a load-test rig - the demo overlay never carried local-capacity-ramp's own 2Gi/2-CPU numbers
  # (those were sized for a Docker Desktop capacity investigation, never meant to land here) - so
  # this is a separate, deliberately smaller change, sized against this node's own real, measured
  # budget (confirmed live via `kubectl describe node` on the demo node, 2026-09-16): 4 CPU / ~5.93Gi
  # allocatable, already carrying ~2020m/2764Mi in requests and ~8900m/7114Mi in limits across every
  # other pod here. Doubling postgres's own request/limit on both axes gives it the same 2x margin
  # over its own proven crash point that fixed Run 1 locally, while moving the node's own limit-side
  # overcommit from 222%/120% to only 235%/126% - not a qualitative change to how tight this node
  # already runs, unlike local-capacity-ramp's own 2Gi/2-CPU config would have been.
  #
  # `max_connections` alone, not `shared_buffers`/`work_mem`/`effective_cache_size` - `2026-09-15-
  # local-capacity-ramp.md`'s own Monte Carlo sweep found no measured benefit from tuning those at
  # this scale, and this item's own discipline (CLAUDE.md rule 7) is to not tune what was not shown
  # to help. 150, not local-capacity-ramp's 300 - that number was sized for 3 api + 3 worker replicas
  # each pooling their own Npgsql connections; `base/api.yaml`/`base/worker.yaml` (never overridden by
  # this overlay) both stay at `replicas: 1`, so a single pool's own realistic demand (Npgsql's default
  # max pool size, 100) is what this number has to clear, with real headroom for a migrator job or an
  # ad-hoc psql session on top - not thousands of connections nobody here will open.
  #
  # `shared_buffers`/`effective_cache_size`/`work_mem`/`maintenance_work_mem` are written out
  # explicitly as postgres:18-alpine's own stock values (128MB/4GB/4MB/64MB) rather than left
  # implicit, matching `local-capacity-ramp`'s own established reasoning for doing the same thing -
  # so this overlay's own numbers don't silently drift if the base image's defaults ever change.
  - target:
      kind: Deployment
      name: postgres
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: postgres
      spec:
        template:
          spec:
            containers:
              - name: postgres
                resources:
                  requests:
                    memory: 512Mi
                    cpu: 500m
                  limits:
                    memory: 1Gi
                    cpu: 1000m
                args:
                  - postgres
                  - -c
                  - max_connections=150
                  - -c
                  - shared_buffers=128MB
                  - -c
                  - effective_cache_size=4GB
                  - -c
                  - work_mem=4MB
                  - -c
                  - maintenance_work_mem=64MB
