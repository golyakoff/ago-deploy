apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ago-chat

resources:
  - ../../base
  - gateway.yaml
  - tls.yaml
  # 8-02: static-file-serving Deployments/Services for the console bundle, the widget's own public
  # demo pages, and the public marketing page at the apex - demo-overlay-only, see each file's own
  # header comment for why none of these belong in ../../base.
  - console-static.yaml
  - demo-shop1-static.yaml
  - demo-shop2-static.yaml
  - landing-static.yaml
  # `15-03`: alerting. Demo-overlay-only, deliberately - see alertmanager.yaml's own header for why
  # this is not in ../../base alongside prometheus.yaml and grafana.yaml, and for why Alertmanager
  # was chosen over Grafana's built-in alerting. Not routed through gateway.yaml and never will be:
  # it holds no data worth reaching from outside, and the same reasoning that removed Grafana's
  # public route applies.
  - alertmanager.yaml
  # `17-05`: the first NetworkPolicy resources in this repository. Demo overlay only - see that
  # file's own header for why they are not in ../../base (the local cluster's CNI has never been
  # shown to enforce policy, and unenforced policy reads as protection).
  - network-policies.yaml

# Same shape as overlays/local/kustomization.yaml's own secretGenerator - one Secret, real values
# this time (adr/0026, .env.example's own header comment: these are NOT the local throwaway
# passwords, generate fresh ones before copying .env.example to .env).
secretGenerator:
  - name: infra-credentials
    envs: [.env]
  # `14-07`/ago-root `adr/0070`: the author's personal Telegram relay config (Xray-core client JSON,
  # UUID included) - deliberately its own Secret rather than one more key in infra-credentials above.
  # See .env.telegram-relay.example's own header for the full reasoning (short version: six of the
  # eight Deployments that read infra-credentials do so via a blanket `envFrom`, which would turn this
  # into a plaintext env var on Postgres and MinIO for no reason; a second Secret confines it to the
  # one sidecar container that mounts it as a file, and its own rotation restarts one Deployment
  # instead of the whole cluster). Same `envs:` source shape as infra-credentials above - the
  # single-line-JSON constraint that implies is explained in the .example file.
  - name: telegram-relay-credentials
    envs: [.env.telegram-relay]

# `15-03`. NOTE THAT NOTHING WAS ADDED TO .env OR .env.example BY THIS ITEM, and the absence is the
# point rather than an omission: the notification channel is the node's own Postfix over the cluster
# bridge, which takes no SMTP AUTH and no TLS (`adr/0040`'s amendment, and .env.example's own
# KEYCLOAK_SMTP_* block records the identical hop for Keycloak). There is no credential to keep out
# of git. The one value that genuinely must not be committed - the human mailbox alerts are forwarded
# to - is not a deployment setting at all: it lives in the node's /etc/aliases, which is neither a
# repository nor a Secret.
configMapGenerator:
  # behavior: merge, not a new generator. The base already declares `prometheus-config` with
  # prometheus.yml in it; merging adds one more key to that same ConfigMap so the rules land in
  # /etc/prometheus next to the config, where base/prometheus-scrape-config.yml's
  # `rule_files: [/etc/prometheus/*.rules.yml]` glob finds them. No second volume, no patch to the
  # Prometheus Deployment, and the ConfigMap hash still changes when the rules change - which is what
  # makes `kubectl apply -k` actually roll the pod instead of leaving it on stale rules.
  - name: prometheus-config
    behavior: merge
    files:
      - demo.rules.yml=prometheus-alert-rules.yml
  - name: alertmanager-config
    files:
      - alertmanager.yml=alertmanager-config.yml

# `15-06`/`adr/0047`: the three host images come from GHCR under an immutable, identifying tag - the
# full commit SHA - instead of the mutable `:local` tag adr/0026 imported straight into containerd.
#
# **This block is the record of what this environment is meant to be running.** `deploy.sh <sha>`
# changes the live Deployments with `kubectl set image` and does not edit this file, so the two drift
# on purpose and in one direction only: a `kubectl apply -k` of this overlay resets the cluster to
# the tag written here. That is a trap if it is forgotten and a feature if it is not, so the rule is
# explicit - after a deploy that is meant to stick, update these three tags and commit. deploy.sh
# prints the exact lines to change, and smoke.sh compares what is running against what is here.
#
# No `imagePullPolicy` patch any more (there were three, one per host, all removed here). The
# default for a non-`:latest` tag is IfNotPresent, which is exactly right for an immutable SHA tag:
# present in containerd, it is used without a network call - so a node that built its own image, or
# imported one, behaves as it always did - and absent, it is pulled from GHCR. `Never` cannot do the
# second half, and the second half is what makes a rebuilt cluster (15-02) able to start at all.
images:
  - name: ago-chat-api
    newName: ghcr.io/golyakoff/ago-chat-api
    newTag: 8588390c8d6cb4e3092ce77f9697e4d272919272
  - name: ago-chat-worker
    newName: ghcr.io/golyakoff/ago-chat-worker
    newTag: 8588390c8d6cb4e3092ce77f9697e4d272919272
  - name: ago-chat-webhooks
    newName: ghcr.io/golyakoff/ago-chat-webhooks
    newTag: 8588390c8d6cb4e3092ce77f9697e4d272919272
  # `8-08`: the migrator moves with the three hosts and never independently - it applies the
  # migrations *that commit* carries, so a migrator on a different SHA from the hosts is the exact
  # mismatch this item exists to prevent. deploy.sh sets all four from one argument for that reason.
  - name: ago-chat-migrator
    newName: ghcr.io/golyakoff/ago-chat-migrator
    newTag: 8588390c8d6cb4e3092ce77f9697e4d272919272
  # `15-07`/`adr/0051`: the four static bundles, which `15-06` could not reach - and the one it did
  # not reach is the one the 2026-08-25 incident happened to. Their four `imagePullPolicy: Never`
  # patches are gone from *-static.yaml for the same reason the three above went.
  #
  # These four do NOT share a tag with each other or with the hosts, and that is not an oversight:
  # they are built from three repositories that move independently, so one SHA cannot name more than
  # the images out of one of them. `deploy.sh <frontend> <sha>` moves one at a time for the same
  # reason. ago-demo-shop1 and ago-demo-shop2 do share a tag, because they really are one commit of
  # ago-widget packaged twice - the difference between them is in the name, never in the tag.
  #
  # Real GHCR-published commits as of 2026-08-27's deploy - the transition this comment used to say
  # was still pending (`15-07`'s own publish jobs) has happened. `IfNotPresent` still applies: present
  # locally it is used as-is, absent it is pulled from GHCR, so nothing here depends on which case a
  # given node is in.
  - name: ago-console
    newName: ghcr.io/golyakoff/ago-console
    newTag: 8a2845983aeb983b5b1faa639e2acabfd6de921b
  - name: ago-demo-shop1
    newName: ghcr.io/golyakoff/ago-demo-shop1
    newTag: 57545879413c13334281f6bc263bd7095988c596
  - name: ago-demo-shop2
    newName: ghcr.io/golyakoff/ago-demo-shop2
    newTag: 57545879413c13334281f6bc263bd7095988c596
  - name: ago-landing
    newName: ghcr.io/golyakoff/ago-landing
    newTag: 467634530e7482eebcf770765b1b5d75c3ef9880

patches:
  # `8-07`/ago-root `adr/0058`: this is the one deployment that wants the demo-credential endpoint, so
  # this is where it is turned on.
  #
  # **`8-09` turned it on** - the one-word diff this block was shaped to make possible. The condition
  # it was waiting for is met: `ago-widget`'s two `public-demo*/index.html` pages now read `?site=`
  # (falling back to their own baked-in key, so every existing link is unaffected) and both render a
  # "Get your own tenant" button that calls this endpoint. A minted viewer's console now has a widget
  # pointing at it, which is what makes the feature better than the shared account rather than worse.
  #
  # **Turning this on publishes an unauthenticated, tenant-creating endpoint on the public internet.**
  # That is intended, and `8-07` built two guards for it that are worth naming here because this is the
  # line that arms them: a per-IP rate limit (3, refilling at ~3/hour) and a total cap on live demo
  # tenants (50), counted from the database inside the request rather than cached. Setting this back to
  # "false" is the whole of the rollback - the endpoint refuses immediately, and `DemoTenantExpiryJob`
  # keeps deleting whatever was already minted.
  #
  # The visitor origin is the public demo shop the minted tenant's `visitorUrl` points a viewer at, and
  # the minted site is created with exactly this origin allowed, so `5-01`'s layer 2 lets its widget
  # connect.
  #
  # A strategic-merge patch, not a JSON-patch by index: kustomize merges `env` by the `name` key, so
  # this changes exactly these two variables and leaves the other twenty alone. An index would have
  # silently overwritten whichever variable happened to sit at that position - which it did, on the
  # first attempt here, where `/env/0` is the database connection string.
  - target:
      kind: Deployment
      name: ago-chat-api
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ago-chat-api
      spec:
        template:
          spec:
            containers:
              - name: api
                env:
                  - name: DemoTenant__Enabled
                    value: "true"
                  - name: DemoTenant__VisitorOrigin
                    value: "https://demo-shop1.reserve-me.ru"
  # The Worker needs the credential to expire tenants, and the flag to require it - but it mints
  # nothing, so it needs no visitor origin.
  - target:
      kind: Deployment
      name: ago-chat-worker
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ago-chat-worker
      spec:
        template:
          spec:
            containers:
              - name: worker
                env:
                  - name: DemoTenant__Enabled
                    value: "true"
  # `14-07`/ago-root `adr/0070`: the Telegram outbound relay - **the first sidecar in this repository.**
  # ago-chat-worker is the only host that makes outbound calls to Telegram's Bot API in the hot path
  # (TelegramLongPollingService's own `getUpdates` polling, and ChannelMessageDeliveryConsumer's
  # outbound replies via TelegramChannelAdapter - both registered only in Ago.Chat.Worker/Program.cs,
  # checked against the `feat/14-07-telegram-channel-adapter` branch in ago-chat before writing this).
  #
  # **Correction to this item's own brief, found by reading the code rather than assuming it:**
  # Ago.Chat.Api *also* calls Telegram once - TelegramChannelEndpoints' `getMe` token-validation check,
  # made synchronously when an operator connects a bot from the console. That call does NOT go through
  # this relay (Ago.Chat.Api's own pod gets no proxy env var, no sidecar) and so is left exposed to the
  # same ~50% failure rate adr/0070 measured direct. This is a deliberate, named gap, not an oversight:
  # it is a one-shot, retry-tolerant setup action (TelegramChannelEndpoints' own remarks already treat
  # a transient failure there as expected - it propagates rather than corrupting state), not the
  # message-delivery path this item's Done-when criteria are actually about. Closing it means either
  # exposing this sidecar beyond loopback (a Service + NetworkPolicy pair, widening exactly the blast
  # radius the sidecar shape exists to avoid, and the tenancy-isolation question `14-07`'s own backlog
  # item already flagged as `17-01`'s to answer) or running a second copy of this same sidecar in
  # Ago.Chat.Api's pod (doubling where the personal relay credential is mounted for a low-volume path).
  # Left as a follow-up rather than decided unilaterally here - see this task's own report.
  #
  # **Why a sidecar (init container with restartPolicy: Always - "native sidecars", GA in Kubernetes
  # 1.29) and not a separate Deployment + Service.** Only one host needs this in its hot path (above).
  # A sidecar shares ago-chat-worker's network namespace, so the relay is reached at 127.0.0.1 exactly
  # as manually verified live on the VPS (adr/0070) - no new Service, no cluster-wide-reachable open
  # SOCKS5 proxy, and it scales with Worker's own replica count automatically instead of needing an
  # independent scaling decision. The alternative the backlog item names (a separate Deployment +
  # ClusterIP Service, reusable by other channels later) was rejected for now on the same grounds
  # `17-05`'s network-policies.yaml already used to reject a namespace-wide default-deny: it is more
  # surface than the one real caller currently needs, and `17-01`'s tenancy-isolation work has not yet
  # said what an in-cluster SOCKS5 proxy should be allowed to reach.
  #
  # **Why an init container with `restartPolicy: Always` rather than a second ordinary entry in
  # `containers:`.** Plain sidecars-via-containers-list have no defined start/stop ordering against the
  # main container - kubelet may SIGTERM both at once. Worker's own `lifecycle.preStop.sleep: 5s`
  # (below, unchanged) exists specifically so in-flight work can drain; an outbound Telegram send mid-
  # flight through the relay during that window must not have the relay itself torn down first. A
  # native sidecar is started before regular containers and stopped after them - kubelet documentation,
  # unverified live here since it needs a real termination race to observe, so this is the one claim in
  # this change that rests on the documented contract rather than a demonstration; see this task's own
  # report.
  #
  # **The image**: the official `ghcr.io/xtls/xray-core`, not a third-party build (`teddysun/xray`,
  # considered - a well-known community image, but the official one needs trusting one fewer party for
  # a container that terminates this deployment's own outbound TLS). Pinned by tag *and* digest
  # (adr/0047's own reasoning for the three ago-chat-* images, applied here to a dependency that moves
  # on its own release cadence rather than with this repository's commits - deliberately NOT added to
  # the `images:` transformer block above, the same way keycloak.yaml's own image is not: both are
  # external images versioned independently of anything in this repository). Digest confirmed directly
  # against the GHCR registry API (`GET /v2/xtls/xray-core/manifests/26.7.11` with an anonymous pull
  # token, `docker-content-digest` response header) rather than trusted from a rendered web page, since
  # a wrong digest here is a silent pull failure at the worst possible time.
  #
  # **No root, no shell in this image** (upstream's own stated design) - `readOnlyRootFilesystem: true`
  # costs nothing extra here (unlike `worker`'s own `/tmp` emptyDir, this container writes no file:
  # config is read-only mounted, logging is left at Xray's own stdout-console default rather than
  # pointed at a file). No `runAsUser` set at the container level - not because it is left to the
  # image (it isn't: the pod-level `securityContext` above, `worker`'s own stated UID 1654, applies to
  # every container that does not override it, this one included, since per-field pod/container
  # securityContext merge means an unset container field inherits the pod's value rather than the
  # image's own default). Demonstrated rather than assumed: this exact image, at this exact pinned
  # digest, run locally as UID 1654 with `--read-only --cap-drop=ALL --security-opt=no-new-privileges`
  # (docker, not this cluster - a rendering task cannot start a real pod) starts cleanly and its SOCKS5
  # listener accepts a connection; a build with no shell and "no root privileges" as its stated design
  # goal turned out to mean exactly what it says, but that is exactly the kind of claim CLAUDE.md's
  # "measure or stay silent" says not to take on faith.
  #
  # A readinessProbe (not a livenessProbe: a crashed process under `restartPolicy: Always` already
  # restarts on its own, which is the whole point of that field) gives `kubectl get pods` an honest
  # "1/2 containers ready" the moment the relay is actually listening, rather than reporting the pod
  # healthy while `worker`'s own Telegram calls would silently fail to reach 127.0.0.1:1080 at all.
  #
  # Resource sizing is a starting point, not a measurement (CLAUDE.md: "measure or stay silent" applies
  # to the number, not to having one) - Xray-core's own documented footprint for one client connection
  # is small; this leaves headroom for several concurrent long-poll/reply connections without being
  # large enough to meaningfully compete with `worker` for the pod's own budget (nfr.md, ago-root).
  - target:
      kind: Deployment
      name: ago-chat-worker
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ago-chat-worker
      spec:
        template:
          spec:
            containers:
              - name: worker
                env:
                  - name: Channels__Telegram__Proxy__Socks5Address
                    value: "127.0.0.1:1080"
            initContainers:
              - name: telegram-relay
                restartPolicy: Always
                image: ghcr.io/xtls/xray-core:26.7.11@sha256:a1644183accdb0b5be967093fe34be756fd5de15fe2ee0206e842ae17350967f
                command: ["/usr/local/bin/xray"]
                args: ["run", "-c", "/usr/local/etc/xray/config.json"]
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  runAsNonRoot: true
                  capabilities:
                    drop: ["ALL"]
                readinessProbe:
                  tcpSocket:
                    port: 1080
                  periodSeconds: 5
                  failureThreshold: 3
                volumeMounts:
                  - name: telegram-relay-config
                    mountPath: /usr/local/etc/xray
                    readOnly: true
                resources:
                  requests:
                    memory: 32Mi
                    cpu: 25m
                  limits:
                    memory: 128Mi
                    cpu: 250m
            volumes:
              - name: telegram-relay-config
                secret:
                  secretName: telegram-relay-credentials
                  items:
                    - key: TELEGRAM_RELAY_XRAY_CONFIG
                      path: config.json
  # `15-06`: the three `imagePullPolicy: Never` patches that used to open this list are gone - see the
  # `images:` block above for why the default is now correct. What adr/0026 reasoned about here (a node
  # that builds its own images and imports them into containerd) is still true; what changed is that an
  # immutable tag makes `IfNotPresent` behave the same way locally *and* able to pull on a rebuilt node.



  - target:
      kind: Deployment
      name: keycloak
    patch: |
      # No imagePullPolicy patch here, deliberately - and this stays true now that the three
      # ago-chat-* patches are gone (`15-06`):
      # keycloak runs the real upstream `quay.io/keycloak/keycloak` image (base/keycloak.yaml), never
      # built locally, so it needs its own default pull policy to actually reach the registry. Copying
      # the Never patch here by pattern-matching the ago-chat-* entries above was a real bug, caught
      # live: it produced ErrImageNeverPull on the real cluster (2026-08-24), since nothing had ever
      # imported a "keycloak:local" tag into this node's containerd - there is no such tag, it was
      # never meant to exist.
      # adr/0026: base/keycloak.yaml's args (start-dev --import-realm --health-enabled=true) are
      # correct for a Keycloak that only ever sees requests addressed to localhost/the in-cluster
      # Service name. Publicly, NGINX Gateway Fabric terminates TLS in front of it and forwards plain
      # HTTP - without --hostname and --proxy-headers, Keycloak would build its own issuer/redirect
      # URLs from the internal http://keycloak:8080 request it actually receives, not
      # https://auth.reserve-me.ru, breaking both the Operator JWT iss-claim check (5-05) and the
      # console's own redirect (8-02). --http-enabled=true is required because Keycloak's own
      # production-mode default (start-dev inherits some of this) refuses plain HTTP once a public
      # --hostname is set, unless told explicitly that TLS is handled upstream. Kept on `start-dev`
      # rather than switching to full production `start` mode - adr/0026's own "Consequences" section
      # names this as a deliberate, stated gap (a demo IdP for one seeded operator), not a silent
      # shortcut. `15-01`/`adr/0036` re-opened that choice on purpose, since "start-dev keeps its data
      # in H2" was one of the reasons the gap mattered, and kept `start-dev` anyway with the reasoning
      # written down there - the remaining blocker is that `sslRequired: "none"` cannot be raised until
      # proxy-header trust is verified end to end through the Gateway, which needs the real node.
      #
      # This patch replaces `args` only. base/keycloak.yaml's `env` (KC_DB*, `15-01`) and its
      # `initContainers` (the one that creates Keycloak's own database) are inherited unchanged, so the
      # demo deployment gets a persistent user store from the same base manifest the local overlay uses
      # - which is the point: this class of bug survived because local and demo agreed on being wrong.
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - "start-dev"
          - "--import-realm"
          - "--health-enabled=true"
          - "--hostname=https://auth.reserve-me.ru"
          - "--hostname-strict=false"
          - "--proxy-headers=xforwarded"
          - "--http-enabled=true"
