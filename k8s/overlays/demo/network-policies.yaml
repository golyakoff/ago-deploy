# `17-05`: the first NetworkPolicy in this repository. Before it, every pod in `ago-chat` could open a
# connection to every other one, which meant the four static-file nginx pods — the pods most directly
# exposed to the public internet, and the ones whose whole job is to hand back bytes from disk — could
# open a TCP connection to Postgres, RabbitMQ, MinIO or Keycloak's admin port. Verified live before
# this file existed, from `ago-console`: `nc -z postgres 5432` and `nc -z rabbitmq 5672` both returned 0.
#
# **The CNI enforces this, checked before it was written.** k3s ships flannel *plus* kube-router's
# network-policy controller, and the controller is on unless `--disable-network-policy` is passed —
# this node's k3s unit passes only `--disable traefik`, and `iptables-save` on the node carries 194
# KUBE-ROUTER-* rules. A policy an unenforcing CNI ignores is worse than no policy, because it reads
# like protection; that is why the check came first. It is re-proved by the demonstration recorded in
# `docs/backlog/17-05-*` rather than left as a claim about a flag.
#
# **Demo overlay only, deliberately.** The local Docker Desktop cluster's CNI is whatever Docker
# Desktop ships, and this repository has never established that it enforces policy. Shipping these in
# `base/` would put unverifiable "protection" on a developer's machine and, if that CNI *does* enforce
# them, break a local cluster in a way nobody would connect to this file.
#
# **Why not a namespace-wide default-deny.** It was considered and refused. `ago-chat` also holds the
# NGINX Gateway Fabric data-plane pod, whose control-plane connection crosses into `nginx-gateway`, and
# cert-manager's HTTP-01 solver pods, which are created in this namespace on demand and carry labels
# this file cannot know ahead of a renewal. A default-deny that is wrong about either takes the public
# certificate or the whole edge down, and it would do so at renewal time — weeks later, with nothing
# pointing back here. The policies below are the part that can be reasoned about completely.
---
# 1. The four static-file sites may talk to nothing but DNS.
#
# Egress only — ingress is deliberately left unrestricted so the Gateway keeps reaching them without
# this file having to encode NGF's own pod labels, which are generated by the Gateway's name.
#
# DNS is allowed even though nginx serves static files and resolves nothing: denying it would make
# every blocked connection fail at name resolution instead of at connect, which proves the wrong
# thing. With DNS open, `postgres` still resolves and the TCP connect is what hangs — that is the
# evidence this policy exists to produce.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: static-sites-egress
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [ago-console, ago-demo-shop1, ago-demo-shop2, ago-landing]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# 2. The stateful backends accept connections only from the workloads that have a reason to open one.
#
# Defence from the other direction: policy 1 stops the static pods reaching out, this stops anything
# else reaching in, so a workload added later without an egress policy of its own does not silently
# gain a database connection.
#
# **The two `ipBlock` entries are load-bearing, and the second one was found by breaking the backup.**
# `10.42.0.1/32` is the k3s flannel bridge — the node as seen from inside a pod, already documented in
# `runbooks/public-deploy.md` for Postfix. `172.17.0.0/16` is Docker's own default bridge, and it is
# here because `k8s/backup/backup.sh` mirrors the MinIO bucket from a `minio/mc` **container run by
# Docker on the host**, reaching MinIO's ClusterIP over the network rather than through
# `kubectl exec`. That container's packets are masqueraded to `10.42.0.1` before they reach the pod —
# `tcpdump` on `cni0` shows a completed handshake from `10.42.0.1` — but the policy is evaluated on
# the **pre-masquerade** source, which is still `172.17.0.x`. So the obvious allowance looks right in
# a packet capture and still drops the connection. Established by A/B on the live node: with
# `10.42.0.1/32` alone `mc alias set` fails; with the policy deleted it succeeds; with
# `172.17.0.0/16` added it succeeds while the policy stands.
#
# That is the naive version of this policy, and its failure mode is the bad one: the nightly backup
# stops at 02:30 UTC with nothing else visibly wrong, and the hourly watchdog is what tells anyone.
#
# Not covered here, on purpose: Keycloak (reached from the Gateway, whose labels are generated),
# Grafana (reached by an SSH tunnel to its ClusterIP, i.e. from the node), Prometheus, Jaeger and
# Alertmanager. Each is an in-cluster-only Service already, and each would need an allowance whose
# shape is less certain than the four below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                # keycloak is here because `15-01`/`adr/0036` moved its user store into this same
                # Postgres. Its init container opens a connection too, from the same pod.
                #
                # ago-chat-migrator was missing until 2026-08-26 and this policy is why the first
                # deploy carrying `8-08` failed: the Job answered "Connection refused" against a
                # Postgres that was accepting connections, because the drop happens before the
                # listener is reached. This file was written by `17-05` and the fourth host arrived
                # in `8-08` after it - neither item was wrong on its own, and nothing either of them
                # could run would have noticed. Adding a workload that talks to Postgres means adding
                # it here, and that sentence is the whole lesson.
                values: [ago-chat-api, ago-chat-worker, ago-chat-webhooks, ago-chat-migrator, keycloak]
        - ipBlock:
            cidr: 10.42.0.1/32
        - ipBlock:
            cidr: 172.17.0.0/16
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-ingress
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [ago-chat-api, ago-chat-worker, ago-chat-webhooks]
        - ipBlock:
            cidr: 10.42.0.1/32
        - ipBlock:
            cidr: 172.17.0.0/16
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-ingress
spec:
  podSelector:
    matchLabels:
      app: rabbitmq
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [ago-chat-api, ago-chat-worker, ago-chat-webhooks]
        - ipBlock:
            cidr: 10.42.0.1/32
        - ipBlock:
            cidr: 172.17.0.0/16
      ports:
        - protocol: TCP
          port: 5672
    # `15-03`: Prometheus scrapes the broker's own metrics port for the dead-letter-queue rule. A
    # separate rule rather than one more entry in the list above, so that Prometheus gains 15692 and
    # not AMQP.
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
        - ipBlock:
            cidr: 10.42.0.1/32
      ports:
        - protocol: TCP
          port: 15692
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio-ingress
spec:
  podSelector:
    matchLabels:
      app: minio
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [ago-chat-api, ago-chat-worker, ago-chat-webhooks]
        # See the header note: the backup's `minio/mc` container is a Docker-bridge source, not a
        # pod and not the flannel bridge. Verified live by running that mirror step with this policy
        # in place, and by watching it fail without this line.
        - ipBlock:
            cidr: 10.42.0.1/32
        - ipBlock:
            cidr: 172.17.0.0/16
      ports:
        - protocol: TCP
          port: 9000
