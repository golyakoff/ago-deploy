# adr/0026: cert-manager + Let's Encrypt, HTTP-01 challenge via the Gateway API (no Ingress resource,
# no DNS-provider credential). cert-manager itself is cluster infrastructure, installed once per
# cluster the same way NGINX Gateway Fabric is (runbooks/public-deploy.md) - not a resource this
# overlay's own kustomization.yaml creates, only consumes.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # Placeholder - replace with a real, reachable address before applying (Let's Encrypt sends
    # certificate-expiry notices here). Never the author's own personal inbox committed to a public
    # repository (architecture/repositories.md - "no personal or employer data") - an address under
    # the domain already being deployed here is the natural choice, but this file intentionally ships
    # with a placeholder, not a real one, exactly like every other credential-shaped value in this
    # overlay.
    email: letsencrypt-admin@agochat.ru
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: ago-chat-gateway
                namespace: ago-chat
                kind: Gateway
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ago-public-tls
spec:
  # One multi-SAN cert for every public host (rather than one per host) - fewer moving parts, and
  # Let's Encrypt's per-registered-domain rate limits are friendlier to a single cert. Re-applying this
  # file re-issues in place; cert-manager does not replay an HTTP-01 challenge a name already passed.
  #
  # `26-267`: the reserve-me.ru names were removed here in phase 4 of the agochat.ru migration
  # (ago-business docs/infra/domain-migration-agochat.md). **Removing a name needs no validation** -
  # only adding does - so this re-issues once for the nine remaining agochat.ru names and none of them
  # is re-challenged. Order matters: the SAN goes first (here) and the reserve-me.ru A-record second
  # (the author's registrar step). Reversed, a renewal would fail HTTP-01 for a name with no DNS, and
  # one failed authorization fails the whole certificate. That gate is exactly why the nine agochat.ru
  # A-records were confirmed resolving to the node before they were ever added (phase 1).
  secretName: ago-public-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - chat-api.agochat.ru
    - auth.agochat.ru
    - demo-shop1.agochat.ru
    - agochat.ru
    - calendar-api.agochat.ru
    - office.agochat.ru
    - files.agochat.ru
    - brandbook.agochat.ru
    - android-design.agochat.ru
