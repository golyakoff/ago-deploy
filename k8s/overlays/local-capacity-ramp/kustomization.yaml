apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# A layer on top of `overlays/local`, not an edit to it. The question this overlay exists to answer -
# "what does scaling ago-chat-api/ago-chat-worker out actually buy, and where does that stop helping"
# - is a one-off capacity investigation, not this project's every-day local dev loop. `overlays/local`
# stays exactly as `3-06` and `8-08` left it (3 api replicas for `least_conn` correctness, worker at
# base's 1) so nobody's regular local-dev bring-up changes shape or resource footprint because of a
# load test. Composing `../local` as this overlay's only resource is the same "layer, don't mutate"
# pattern `overlays/demo` already uses against `base` - kustomize resolves `../local`'s own patches
# first, then applies the two below on top of that result.
resources:
  - ../local

patches:
  # ago-chat-worker is stateless (a RabbitMQ consumer, no local state of its own - same reasoning
  # `3-06`'s own comment gives for why ago-chat-api can run >1 replica safely) and this investigation's
  # first question is literally "does replicating it help," so it needs to be >1 to have an answer.
  # Matches ago-chat-api's own 3, set by `overlays/local` already, so ingest and delivery are scaled
  # symmetrically instead of moving only one side of the pipeline.
  - target:
      kind: Deployment
      name: ago-chat-worker
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: ago-chat-api
    patch: |
      # VisitorSessionRateLimitOptions's own doc comment (ago-chat/src/Ago.Chat.Api/Auth/
      # VisitorSessionRateLimitOptions.cs) already says its default (20 handshakes/site, ~20/min
      # refill) is "not measured or load-tested - a starting point." A capacity ramp aimed at finding
      # this deployment's own ceiling must not have that starting-point default answer the question
      # first - 20 concurrent new visitor sessions is far below any step this ramp intends to reach.
      # Raised only in this overlay, never in base or demo: the low default is the right production
      # posture (per-site handshake abuse protection), and this override exists to get it out of the
      # way for one investigation, not to change what a real site is allowed to do.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: VisitorSessionRateLimit__PerSiteCapacity
          value: "5000"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: VisitorSessionRateLimit__PerSiteRefillPerSecond
          value: "500"
      # Found live running this overlay's own first real ramp: raising VisitorSessionRateLimit alone
      # was not enough - StartConversationHandler sits behind a second, separate limiter,
      # ConversationCreateRateLimitOptions, whose own default (100 new conversations/site, ~100/hour
      # refill) is far below a single step of this ramp and was never touched by the change above.
      # Same reasoning as VisitorSessionRateLimit's own comment: this is a per-site abuse guard with
      # an admittedly unmeasured default, raised only in this one-off overlay so the investigation
      # is not answering "where is the rate limiter", never a change to what a real site allows.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ConversationCreateRateLimit__PerSiteCapacity
          value: "5000"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ConversationCreateRateLimit__PerSiteRefillPerSecond
          value: "500"
      # A third limiter, found the same way as the second: MessageSendRateLimitOptions's own default
      # (100 messages/site, ~1.67/s refill) is what a light, realistic trickle of per-conversation
      # messages from hundreds of held-open conversations runs into next, once the two connection-
      # side limiters above stop being the first thing hit. Same one-off-overlay-only reasoning.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MessageSendRateLimit__PerSiteCapacity
          value: "5000"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MessageSendRateLimit__PerSiteRefillPerSecond
          value: "500"
  # `2026-09-15-local-capacity-ramp.md`'s own finding: at 500 concurrently open conversations,
  # Postgres - not either stateless host - hit its container memory limit (base/postgres.yaml's own
  # 512Mi, the same number production runs under) and one backend died hard enough to trigger a full
  # crash-recovery cycle. 4x memory and 4x CPU, request scaled with each so the request/limit ratio
  # base already uses stays the same (50% memory, also now 50% CPU). Nothing in that report pointed
  # at CPU as a constraint on its own (postgres sat at low double-digit percent of its 500m limit
  # throughout) - raised anyway, at the author's own explicit request, so a second run does not have
  # to ask "was it memory or CPU that actually helped" with only one of the two moved.
  - target:
      kind: Deployment
      name: postgres
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 1024Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 2048Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 1000m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 2000m
