apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ago-chat-gateway
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: ago-chat.localhost
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ago-chat-api
spec:
  parentRefs:
    - name: ago-chat-gateway
  hostnames:
    - ago-chat.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /healthz
      backendRefs:
        - name: ago-chat-api
          port: 80
    # 3-06: the visitor-session issuance path (Auth/AuthEndpoints.cs) and both SignalR hubs - added
    # now because proving least_conn and cross-node reconnect over 3 replicas needs real hub traffic
    # through the Gateway, not just the health path Stage 0 verified. Stale "arrive with Stage 1"
    # comment removed - those endpoints have existed since Stage 1/2, this route just never caught up.
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: ago-chat-api
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /hubs
      backendRefs:
        - name: ago-chat-api
          port: 80
---
apiVersion: gateway.nginx.org/v1alpha1
kind: UpstreamSettingsPolicy
metadata:
  name: ago-chat-api-least-conn
spec:
  targetRefs:
    - group: core
      kind: Service
      name: ago-chat-api
  # least_conn, not round-robin: with long-lived WebSockets, round-robin distributes connection
  # *events* evenly but leaves connection *counts* skewed after any partial outage (edge.md).
  loadBalancingMethod: least_conn
