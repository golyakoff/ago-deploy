apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ago-chat

resources:
  - ../../base
  - gateway.yaml
  # `10-05`: the local mail sink Keycloak's realm points at, local-overlay-only on purpose - that
  # file's own header says why a sink must never reach base/ or the demo overlay.
  - mailpit.yaml

# Same shape as docker/.env (copy the values across so both loops use the same local dev
# passwords) - kustomize refuses to read a secretGenerator source from outside its own directory
# tree (a deliberate anti-path-traversal restriction), so this cannot simply point at
# ../../../docker/.env. One Secret, not three: these are throwaway local passwords, and three
# generators reading the same file would each carry all six keys anyway (`envs:` loads the whole
# file, it does not filter per generator).
secretGenerator:
  - name: infra-credentials
    envs: [.env]

# Images built locally (runbooks/local-dev.md) never come from a registry, so a pull must never be
# attempted - imagePullPolicy: Never turns "forgot to build the image" into a clear ErrImageNeverPull
# instead of a confusing hang waiting on a registry that does not have this tag.
patches:
  - target:
      kind: Deployment
      name: ago-chat-api
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
      # 3-06: three replicas is the direct proof this backlog item needs - one visitor's node dies,
      # it reconnects to a different one, the Gateway's least_conn UpstreamSettingsPolicy
      # (gateway.yaml) has more than one live upstream to actually balance across. base/api.yaml
      # stays at 1 (no other overlay needs 3 today).
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: ago-chat-worker
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Deployment
      name: ago-chat-webhooks
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
